<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devoir — Centre VÉRITAS</title>
<meta name="description" content="Un devoir donné par votre enseignant sur les livrets interactifs du Centre VÉRITAS.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Un devoir t'attend — Centre VÉRITAS">
<meta property="og:description" content="Ton enseignant t'a envoyé un devoir à faire en ligne. Ouvre-le, réponds, et reçois ta correction.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="/assets/veritas-tokens.css?v=1.19.25">
<link rel="stylesheet" href="/assets/veritas-pages.css?v=1.19.25">
<style>
  .dv{ max-width:760px; margin:0 auto; }
  .exo{ border:1px solid var(--vp-line,#e3e8ef); border-radius:14px; padding:16px 18px; margin:12px 0; background:#fff; }
  .exo.verr{ background:repeating-linear-gradient(135deg,#f7f9fc,#f7f9fc 10px,#f2f5f9 10px,#f2f5f9 20px); border-style:dashed; }
  .exo h4{ margin:0 0 6px; font-size:14px; font-weight:600; color:var(--vp-accent,#1E499B); }
  .exo .rep{ font-size:12.5px; color:#6b7684; margin:0 0 8px; }
  .exo textarea{ width:100%; box-sizing:border-box; min-height:74px; padding:10px 12px; font:inherit;
    font-size:15px; border:1.5px solid #cfd6dd; border-radius:10px; resize:vertical; }
  .exo textarea:focus{ outline:none; border-color:var(--vp-accent,#1E499B); }
  .num{ display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%;
    background:var(--vp-accent,#1E499B); color:#fff; font-size:12.5px; font-weight:600; margin-right:8px; }
  .mur{ border:2px dashed #d8b24a; background:#fffdf4; border-radius:16px; padding:22px; text-align:center; margin:18px 0; }
  .mur .p{ font-family:inherit; font-weight:600; font-size:30px; color:#8a6d1f; margin:6px 0 2px; }
  .barre{ display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
  .b{ border:none; border-radius:10px; padding:11px 18px; font:inherit; font-weight:600; font-size:14.5px; cursor:pointer; }
  .b1{ background:var(--vp-accent,#1E499B); color:#fff; }
  .b2{ background:#fff; color:#334; border:1.5px solid #cfd6dd; }
  .b3{ background:#d8b24a; color:#3a2f0b; }
  .b:disabled{ opacity:.55; cursor:default; }
  .note{ display:inline-block; background:#f2f8ea; border:1.5px solid #57a52c; color:#33512a;
    border-radius:10px; padding:6px 14px; font-weight:600; }
  .app{ background:#eef4fb; border-left:4px solid #2b8ac6; border-radius:0 10px 10px 0; padding:10px 14px;
    margin:10px 0; color:#294b66; line-height:1.6; }
  .cmt{ background:#fff8ec; border-left:4px solid #d8b24a; border-radius:0 8px 8px 0; padding:7px 12px;
    margin:8px 0 0; font-size:13.5px; color:#6b5410; }
  .msg{ min-height:20px; font-size:13.5px; margin:8px 0; }
  .ko{ color:#c0453f; } .ok{ color:#3f7a2c; }
  .meta{ font-size:13px; color:#6b7684; }
</style>
</head>
<body>
<header class="top">
  <span class="badge">Centre VÉRITAS · Devoir en ligne</span>
  <h1 id="titre">Chargement du devoir…</h1>
  <p id="soustitre" class="meta"></p>
</header>
<div class="wrap dv">
  <div id="corps"><p class="note">Un instant…</p></div>
</div>
<footer class="bot">© <span id="y"></span> Centre VÉRITAS · Mythe Errant — Douala, Cameroun ·
  <a href="https://veritas-school.com/livrets/">Les livrets en ligne</a></footer>

<script src="/livrets/gate.js?v=29598ca7"></script>
<!-- Même règle de clé que le cahier de l'élève : sans elle, l'exercice que
     l'enseignant a désigné ne se retrouve pas ici, et le devoir s'affiche sans
     son énoncé. Voir `refResoudre()` dans collab.js. -->
<script src="/livrets/cahier.js?v=1.20.16"></script>
<script src="/livrets/collab.js?v=0c06e8ee"></script>
<script>
(function(){
  'use strict';
  document.getElementById('y').textContent = new Date().getFullYear();
  var C = window.VRTCollab, G = window.VRTLivret;
  var $ = function(id){ return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('t') || '';
  var etat = { classe:'', apercu:null, devoir:null, macopie:null };

  C.parrainLire();      // retient le parrain s'il y en a un
  C.noterVisite();      // compte l'invitation, sans rien stocker sur le visiteur

  function msg(t, ok){ var e=$('msg'); if(e){ e.textContent=t||''; e.className='msg '+(ok?'ok':'ko'); } }

  if(!token){ rendreErreur('Lien incomplet — il manque la référence du devoir.'); return; }

  function rendreErreur(t){
    $('titre').textContent = 'Devoir introuvable';
    $('soustitre').textContent = '';
    $('corps').innerHTML = '<div class="mur"><p>'+C.esc(t)+'</p>'
      + '<a class="b b2" href="https://veritas-school.com/livrets/">Voir les livrets en ligne</a></div>';
  }

  // ── 1. Aperçu public : ce que voit n'importe qui ────────────────────────────
  C.post({ action:'devoir_apercu', t: token }).then(function(r){
    etat.apercu = r.apercu; etat.classe = r.apercu.niveau;
    $('titre').textContent = r.apercu.titre;
    var s = [];
    if(r.apercu.profNom) s.push('Donné par ' + r.apercu.profNom);
    s.push('Classe de ' + r.apercu.niveau);
    s.push(r.apercu.total + ' exercice' + (r.apercu.total>1?'s':''));
    if(r.apercu.du) s.push('à rendre le ' + C.dateFr(r.apercu.du));
    if(r.apercu.rejoints > 0) s.push(r.apercu.rejoints + ' élève' + (r.apercu.rejoints>1?'s ont':' a') + ' déjà rendu');
    $('soustitre').textContent = s.join(' · ');

    // Ai-je déjà un code pour cette classe ?
    G.config({ classe: etat.classe, kind:'livret', titre:'Livret ' + etat.classe });
    G.onOuvert = ouvrirEleve;
    return G.resume().then(ouvrirEleve, rendreApercu);
  }).catch(function(e){ rendreErreur(e.message || 'Ce lien n\'est plus valide.'); });

  // ── 2. Vue publique : le mur d'abonnement ───────────────────────────────────
  function rendreApercu(){
    var a = etat.apercu, h = [];
    if(a.consigne) h.push('<p>'+C.esc(a.consigne)+'</p>');

    a.items.forEach(function(it){
      if(it.src === 'prof'){
        // Exercice écrit par l'enseignant : il lui appartient, on le montre.
        h.push('<div class="exo"><h4><span class="num">'+it.n+'</span>Exercice de ton enseignant</h4>'
          + '<p style="margin:0">'+C.esc(it.consigne)+'</p></div>');
      } else {
        h.push('<div class="exo verr"><h4><span class="num">'+it.n+'</span>Exercice du livret</h4>'
          + '<p class="rep" style="margin:0">🔒 '+C.esc(it.repere||'Réservé aux élèves qui ont leur livret')+'</p></div>');
      }
    });

    h.push('<div class="mur">'
      + '<div style="font-size:34px">📘</div>'
      + '<p style="margin:6px 0 0"><strong>Pour répondre et recevoir ta correction</strong>, il te faut le livret en ligne de '
      + C.esc(a.niveau) + '.</p>'
      + (a.verrouilles ? '<p class="meta" style="margin:6px 0 0">'+a.verrouilles+' exercice'+(a.verrouilles>1?'s':'')
          +' de ce devoir viennent du livret et restent masqués.</p>' : '')
      + '<div class="p">1 500 FCFA</div>'
      + '<p class="meta" style="margin:0 0 12px">l\'année scolaire · Orange Money, MTN MoMo ou carte</p>'
      + '<div class="barre" style="justify-content:center">'
      + '<button class="b b3" id="acheter">Obtenir mon accès</button>'
      + '<button class="b b2" id="jai">J\'ai déjà un code</button>'
      + '</div>'
      + '<div id="zone-code"></div>'
      + '<div id="msg" class="msg"></div>'
      + '</div>');
    $('corps').innerHTML = h.join('');

    $('acheter').onclick = function(){ G.acheter(); };
    $('jai').onclick = function(){
      $('zone-code').innerHTML = '<input id="code" placeholder="VRT-'+C.esc(a.niveau.toUpperCase())+'-XXXX-XXXX" '
        + 'style="width:100%;box-sizing:border-box;margin:10px 0 6px;padding:11px 14px;border:2px solid #cfd6dd;'
        + 'border-radius:10px;font-size:16px;text-align:center;letter-spacing:.06em;text-transform:uppercase">'
        + '<button class="b b1" id="ok" style="width:100%">Débloquer</button>';
      $('ok').onclick = function(){
        var b=this; b.disabled=true; b.textContent='Vérification…'; msg('');
        G.unlock(($('code')||{}).value||'').then(ouvrirEleve).catch(function(e){
          b.disabled=false; b.textContent='Débloquer'; msg(e.message||'Code refusé.');
        });
      };
      $('code').focus();
    };
  }

  // ── 3. Vue élève : le devoir complet, avec ses champs de réponse ────────────
  function ouvrirEleve(){
    // Un achat qui vient d'aboutir crédite le parrain (idempotent côté serveur).
    try { var rf = sessionStorage.getItem('vrt-livret-ref'); if(rf) C.convertir(rf); } catch(e){}

    return C.post({ action:'devoir_ouvrir', t: token, token: C.jeton(etat.classe,'livret') })
      .then(function(r){ etat.devoir = r.devoir; etat.macopie = r.macopie; rendreEleve(); })
      .catch(function(e){
        if(e.tag === 'auth'){ rendreApercu(); msg('Session expirée — ressaisis ton code.'); }
        else rendreErreur(e.message || 'Impossible d\'ouvrir ce devoir.');
      });
  }

  function rendreEleve(){
    var d = etat.devoir, moi = etat.macopie || {}, h = [];
    var corrigee = !!moi.rendue;
    /* L'ouvrage préfixe les clés d'exercice : sans lui, aucune référence ne se
       résout et chaque exercice du cahier s'afficherait sans son énoncé. Cette
       page n'a pas de `?o=` — le devoir, lui, dit sa classe. */
    C.ouvrage(d.niveau || '');

    if(corrigee){
      h.push('<div style="margin:6px 0 14px">'
        + (moi.note!=null ? '<span class="note">Note : '+moi.note+' / '+(moi.sur||20)+'</span>' : '')
        + (moi.appreciation ? '<div class="app"><strong>Appréciation :</strong> '+C.esc(moi.appreciation)+'</div>' : '')
        + '</div>');
    } else if(moi.envoye){
      h.push('<p class="msg ok">Copie envoyée le '+C.dateFr(moi.envoye)+'. Tu peux encore la modifier tant qu\'elle n\'est pas corrigée.</p>');
    }
    if(d.consigne) h.push('<p>'+C.esc(d.consigne)+'</p>');
    if(!d.ouvert) h.push('<p class="msg ko">Ce devoir est clos : tu ne peux plus envoyer de réponse.</p>');

    h.push('<input id="nom" placeholder="Ton nom et prénom" value="'+C.esc(moi.nom||'')+'" '
      + 'style="width:100%;box-sizing:border-box;margin:6px 0 14px;padding:11px 14px;border:1.5px solid #cfd6dd;'
      + 'border-radius:10px;font-size:15px">');

    (d.items||[]).forEach(function(it){
      var titre, corps = '', rep = '';
      if(it.src === 'prof'){
        titre = 'Exercice de ton enseignant';
        corps = '<p style="margin:0 0 8px">'+C.esc(it.consigne)+'</p>';
      } else {
        // Résolu ICI, dans les données du livret que l'élève possède.
        var r = C.refResoudre(it.ref);
        titre = 'Exercice du livret';
        rep = '<p class="rep">'+C.esc(it.repere || C.refRepere(it.ref, d.niveau))+'</p>';
        corps = r && r.consigne
          ? '<p style="margin:0 0 8px">'+C.esc(r.consigne)+'</p>'
          : '<p style="margin:0 0 8px" class="rep">Ouvre cet exercice dans <a href="/livrets/'
            + C.esc(d.niveau) + '.html">ton livret</a> pour le lire en entier.</p>';
      }
      var val = (moi.reponses||{})['q'+it.n] || '';
      var cmt = (moi.commentaires||{})[String(it.n)] || '';
      h.push('<div class="exo"><h4><span class="num">'+it.n+'</span>'+titre+'</h4>'+rep+corps
        + '<textarea data-q="q'+it.n+'"'+(corrigee||!d.ouvert?' readonly':'')+'>'+C.esc(val)+'</textarea>'
        + (cmt ? '<div class="cmt"><strong>Remarque :</strong> '+C.esc(cmt)+'</div>' : '')
        + '</div>');
    });

    h.push('<div id="msg" class="msg"></div>');
    h.push('<div class="barre">'
      + (corrigee || !d.ouvert ? '' : '<button class="b b1" id="envoyer">Envoyer ma copie</button>')
      + '<button class="b b2" id="partager">Partager ce devoir</button>'
      + '<a class="b b2" href="/livrets/'+C.esc(d.niveau)+'.html">Ouvrir mon livret</a>'
      + '</div>');
    $('corps').innerHTML = h.join('');

    var env = $('envoyer');
    if(env) env.onclick = envoyer;
    $('partager').onclick = partager;
  }

  function envoyer(){
    var b = $('envoyer'); b.disabled = true; b.textContent = 'Envoi…';
    var rep = {};
    [].forEach.call(document.querySelectorAll('textarea[data-q]'), function(t){ rep[t.getAttribute('data-q')] = t.value; });
    C.post({ action:'soumettre', t: token, token: C.jeton(etat.classe,'livret'),
             nom: ($('nom')||{}).value || '', reponses: rep })
      .then(function(){
        b.disabled = false; b.textContent = 'Envoyer ma copie';
        msg('Copie envoyée. Ton enseignant la verra dans sa console.', true);
      })
      .catch(function(e){
        b.disabled = false; b.textContent = 'Envoyer ma copie';
        msg(e.message || 'Envoi impossible.');
      });
  }

  function partager(){
    var lien = C.lienPartage(token, etat.classe);
    var txt = 'Devoir de français — ' + (etat.devoir ? etat.devoir.titre : '') + '\n' + lien;
    if(navigator.share){ navigator.share({ text: txt }).catch(function(){}); return; }
    try { navigator.clipboard.writeText(lien); msg('Lien copié — colle-le dans ton groupe de classe.', true); }
    catch(e){ msg('Copie impossible : ' + lien); }
  }
})();
</script>
<script src="/assets/ambassa.js?v=1.19.44" defer></script>
</body>
</html>
