<script>
(function(){
  "use strict";
  var A=VRT.app, $=function(s,c){return (c||document).querySelector(s)}, $$=function(s,c){return [].slice.call((c||document).querySelectorAll(s))}, esc=A.esc;
  var id=new URLSearchParams(location.search).get("id")||"";
  var L=(window.VRT_LECONS||{})[id], boite=$("#lecon");
  if(!L){ boite.innerHTML='<p class="vide">Cette leçon n\'existe pas encore. <a href="index.html">Retour aux cours</a>.</p>'; return; }
  function demarrer(mur){
  var M=A.PAR_ID[L.m]||A.MATIERES[0];
  A.teinter(M); A.rail($("#rail"),L.c,L.m); A.chiffreSerie($("#serie"));
  document.title=L.titre+" · "+L.c+" · "+M.nom+" | VÉRITAS";
  var md=document.querySelector('meta[name=description]'); if(md) md.content=(L.intro||"").slice(0,155);

  /* leçons voisines de la même matière et classe */
  var soeurs=Object.keys(VRT_LECONS).filter(function(k){var x=VRT_LECONS[k];return x.m===L.m&&x.c===L.c}).sort(function(a,b){return VRT_LECONS[a].n-VRT_LECONS[b].n});
  var i=soeurs.indexOf(id), prec=soeurs[i-1], suiv=soeurs[i+1];
  var sc=A.scenesPour(L), nomScene=function(s){return (window.VRT_SCENES_TITRES||{})[s]||s.replace(/^(3e|1re|tle)-[a-z\-]+?-/,"").replace(/-/g," ")};

  /* Leçon approfondie (16/11/2026) : une situation-problème (L.enquete) résolue partie après partie
     (p.fil = indice), des planches 2D et 3D (p.planches), un dénouement chiffré (L.denouement). */
  var ouvertes=L.parties.filter(function(p){return !p.verrou}), nPl=0, nFil=ouvertes.filter(function(p){return p.fil}).length, kFil=0;
  function planche(pl,k,i){ nPl++; var tag='<div class="pl-t"><span class="pl-tag">Planche '+nPl+'</span>'+esc(pl.titre||"")+'</div>';
    if(pl.type==="3d") return '<figure class="p3d">'+tag+'<div data-p3d="'+k+'-'+i+'"></div>'+(pl.legende?'<figcaption>'+esc(pl.legende)+'</figcaption>':'')+'</figure>';
    return '<figure class="illus planche">'+tag+pl.svg+(pl.legende?'<figcaption>'+esc(pl.legende)+'</figcaption>':'')+'</figure>'; }
  /* Situation-problème structurée : contexte, documents, problème, tâche, hypothèses (tranchées par les indices). */
  var E=L.enquete, ETAT={rejetee:"Rejetée",validee:"Validée",precisee:"Précisée"};
  var enquete=E?'<section class="enquete" id="enquete"><div class="enq-t"><span class="pl-tag">Situation-problème</span><h2>'+esc(E.titre)+'</h2></div>'+
     (E.svg?'<figure class="illus planche enq-fig">'+E.svg+(E.legende?'<figcaption>'+esc(E.legende)+'</figcaption>':'')+'</figure>':'')+
     '<div class="enq-r">'+(E.contexte||E.recit||"")+'</div>'+
     (E.documents?'<div class="enq-docs">'+E.documents.map(function(d,i){return '<div class="enq-doc"><p class="enq-doc-t"><span>Document '+(i+1)+'</span>'+esc(d.t)+'</p>'+d.html+(d.source?'<p class="enq-src">'+esc(d.source)+'</p>':'')+'</div>'}).join("")+'</div>':'')+
     '<p class="enq-q"><b>Le problème à résoudre</b>'+E.question+'</p>'+
     (E.tache?'<p class="enq-tache"><b>Ta tâche</b>'+E.tache+'</p>':'')+
     (E.hypotheses?'<div class="hyp"><p class="hyp-t">Les hypothèses de départ <small>elles seront tranchées au fil de la leçon</small></p><ol>'+E.hypotheses.map(function(h,i){return '<li data-h="'+i+'"><span class="hyp-l">'+String.fromCharCode(65+i)+'</span><span class="hyp-x">'+h+'</span><span class="hyp-e">À vérifier</span></li>'}).join("")+'</ol></div>':'')+
     (nFil?'<ol class="enq-pistes" aria-label="Les indices de la leçon">'+ouvertes.filter(function(p){return p.fil}).map(function(p,i){return '<li data-indice="'+(i+1)+'"><span>'+(i+1)+'</span>'+esc(p.t)+'</li>'}).join("")+'<li class="fin"><span>✓</span>Solution</li></ol>':'')+'</section>':'';
  function filHtml(f){ if(typeof f==="string") return f; return f.html+(f.verdicts?'<ul class="verdicts">'+f.verdicts.map(function(v){return '<li class="v-'+v[1]+'"><b>Hypothèse '+String.fromCharCode(65+v[0])+' : '+ETAT[v[1]]+'</b> '+(v[2]||"")+'</li>'}).join("")+'</ul>':''); }
  var D=L.denouement, denouement=D&&!mur?'<section class="denouement" id="denouement"><div class="enq-t"><span class="pl-tag">Situation résolue</span><h2>'+esc(D.titre||"Le problème est résolu")+'</h2></div>'+
     (D.html||"")+(D.etapes?'<ol class="den-etapes">'+D.etapes.map(function(e){return '<li>'+e+'</li>'}).join("")+'</ol>':'')+
     (D.reponse?'<div class="reponse"><b>La réponse rédigée</b>'+D.reponse+'</div>':'')+
     (D.transfert?'<div class="transfert"><b>À ton tour : une situation nouvelle</b>'+D.transfert+'</div>':'')+'</section>':'';
  /* 18/11/2026 « même dans les leçons » : carte mentale de la leçon (parties + « à retenir »), _src/00-carte-mentale.js.
     Une seule fois, en fin de cours (« applique aussi les cartes aux leçons pour les enrichir ») : pas aussi dans la Révision (règle « pas de doublon »). */
  var carteM="";
  if(!mur&&window.VRT_CM){ try{ var cmH=VRT_CM.lecon(L); if(cmH){ if(!document.getElementById("cmCss")){ var st=document.createElement("style"); st.id="cmCss"; st.textContent=VRT_CM.css; document.head.appendChild(st); }
    carteM='<div class="partie cm-lecon"><h2><span class="num">'+A.pic("cible",20)+'</span><span class="txt">La carte mentale de la leçon</span></h2>'+cmH+'</div>'; } }catch(e){ carteM=""; } }
  var parties=ouvertes.map(function(p,k){
    return '<div class="partie" id="p'+(k+1)+'"><h2><span class="num">'+(k+1)+'</span><span class="txt">'+esc(p.t)+'</span></h2>'+p.html+
      (p.planches?p.planches.map(function(pl,i){return planche(pl,k,i)}).join(""):'')+
      (p.fil?'<aside class="fil" data-fil="'+(++kFil)+'"><div class="fil-t"><span class="fil-n">Indice '+kFil+' / '+nFil+'</span>Retour à la situation</div>'+filHtml(p.fil)+'</aside>':'')+
      (p.illus?'<figure class="illus">'+p.illus.svg+'<figcaption>'+esc(p.illus.legende||"")+'</figcaption></figure>':'')+
      (p.labo?'<div class="anim"><div class="anim-t"><span class="anim-p" aria-hidden="true">'+A.pic("lecture",14)+'</span>Activité d\'apprentissage : à toi de manipuler</div><div class="anim-c" data-labo="'+k+'"></div></div>':'')+(p.anim?'<div class="anim"><div class="anim-t"><span class="anim-p" aria-hidden="true">'+A.pic("lecture",14)+'</span>'+esc(p.animT||"À toi de manipuler")+'</div><div class="anim-c" data-anim="'+k+'"></div></div>':'')+
      (p.retenir?'<p class="retenir">'+p.retenir+'</p>':'')+'</div>';
  }).join("");
  var scenesHtml=sc.map(function(s){return '<a class="scene" href="/scenes/'+s+'.html"><span class="pl">'+A.pic("masques",30)+'</span><span><small>Scène vivante</small><strong>'+esc(nomScene(s))+'</strong></span><span class="jouer">'+A.pic("lecture",30)+'</span></a>'}).join("");
  var resL=A.resLecon(L.c,L.m,L.n), plus=resL.length?'<section class="res-fam res-lecon"><h2>'+A.pic("fleche",20)+'Pour aller plus loin</h2><div class="res-g">'+resL.map(A.carteRes).join("")+'</div></section>':'';
  var appel=L.examen?'<a class="appel" href="'+esc(L.examen.href)+'">'+A.ico("p-parent",40)+'<div><strong>'+esc(L.examen.t)+'</strong><span>'+esc(L.examen.d||"Des sujets réels, corrigés pas à pas.")+'</span></div><span class="chev" aria-hidden="true">›</span></a>':'';
  var nav='<nav class="suite" aria-label="Leçons voisines">'+(prec?'<a class="su-prec" href="lecon.html?id='+prec+'"><span class="su-fl" aria-hidden="true">‹</span><span><small>Leçon précédente</small>'+esc(VRT_LECONS[prec].titre)+'</span></a>':'<span></span>')+(suiv?'<a class="su-suiv" href="lecon.html?id='+suiv+'"><span><small>Leçon suivante</small>'+esc(VRT_LECONS[suiv].titre)+'</span><span class="su-fl" aria-hidden="true">›</span></a>':'<a class="su-suiv" href="matiere.html?c='+encodeURIComponent(L.c)+'&m='+L.m+'"><span><small>Tout le programme</small>'+esc(M.nom)+' · '+esc(L.c)+'</span><span class="su-fl" aria-hidden="true">›</span></a>')+'</nav>';

  boite.innerHTML=
   '<p class="ariane"><a href="index.html">Apprendre</a><span>›</span><a href="index.html?c='+encodeURIComponent(L.c)+'">'+esc(L.c)+'</a><span>›</span><a href="matiere.html?c='+encodeURIComponent(L.c)+'&m='+L.m+'">'+esc(M.nom)+'</a><span>›</span>'+esc(L.titre)+'</p>'+
   /* En-tête « parlant » (17/11/2026, retour de Jacques : « trop simple et pas assez parlant ») :
      teinte de la matière, chapitre, place de la leçon dans la matière, situation de départ encadrée. */
   '<header class="bandeau ent"><div class="ent-haut"><span class="medaille">'+A.icoM(M,48)+'</span><div class="ent-tags"><span class="sur" id="sur">Cours</span><span class="ent-mat"><b>'+esc(M.nom)+'</b> · '+esc(L.c)+'</span></div></div>'+
     '<h1>'+esc(L.titre)+'</h1>'+
     (L.chap?'<p class="ent-chap">'+A.pic("livre",16)+'<span>Chapitre : <b>'+esc(L.chap)+'</b></span></p>':'')+
     (soeurs.length>1?'<div class="ent-pos"><span>'+(L.n<900?'Leçon '+L.n+' du programme MINESEC':'Leçon '+(i+1))+'</span><span class="ent-barre" aria-hidden="true"><i style="width:'+Math.round((i+1)/soeurs.length*100)+'%"></i></span><span>'+(i+1)+' / '+soeurs.length+' leçons rédigées</span></div>':(L.n<900?'<p class="ent-pos"><span>Leçon '+L.n+' du programme MINESEC</span></p>':''))+
     (L.accroche?'<div class="ent-situ"><span class="ent-situ-t">'+A.pic("cible",16)+'Situation de départ</span><p class="accroche">'+esc(L.accroche)+'</p></div>':'')+
     '<div class="puces"><span>'+A.pic("horloge",14)+' '+(L.duree||15)+' min</span><span>'+L.parties.length+' parties</span>'+(L.labo||L.parties.some(function(p){return p.anim||p.labo})?'<span>'+A.pic("lecture",14)+' labo interactif</span>':'')+'<span>'+A.pic("coche",14)+' quiz de '+(L.quiz.length||L.nq||0)+' questions</span>'+(A.scenesPour(L).length?'<span>'+A.pic("masques",16)+' scène vivante</span>':'')+'</div></header>'+
   '<div class="formats" role="tablist" aria-label="Formats de la leçon">'+
     '<button type="button" role="tab" aria-selected="true" data-f="cours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>Cours</button>'+
     '<button type="button" role="tab" aria-selected="false" data-f="revision"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Révision</button>'+
     '<button type="button" role="tab" aria-selected="false" data-f="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5h.01"/></svg>Quiz</button>'+
   '</div>'+
   '<section class="grille" data-panneau="cours"><aside class="sommaire" aria-label="Sommaire"><p>Sommaire</p><ol>'+L.parties.map(function(p,k){return p.verrou?'<li class="ferme">'+VRT.verrou.CADENAS+esc(p.t)+'</li>':'<li><a href="#p'+(k+1)+'">'+(k+1)+'. '+esc(p.t)+'</a></li>'}).join("")+'</ol><div class="lu"><span id="luTxt">Lecture : 0 %</span><div class="barre-p"><i id="luBar" style="width:0"></i></div></div></aside>'+
     '<article class="carte"><div class="outils-pdf"><button type="button" class="btn-l" onclick="print()">⤓ PDF</button></div>'+
     '<div id="kalaoCours"></div>'+
     (L.intro?'<aside class="info-b"><h2><span class="apc-i">'+A.pic("lecture",20)+'</span>Pour commencer</h2><p class="info">'+L.intro+'</p></aside>':'')+
     (L.apc&&!L.enquete?'<aside class="apc"><h2><span class="apc-i">'+A.pic("boussole",20)+'</span>Situation de vie</h2><p class="apc-s">'+esc(L.apc.situation)+'</p><div class="apc-t"><span class="apc-i">'+A.pic("crayon",18)+'</span><p><b>Ta tâche</b>'+esc(L.apc.tache)+'</p></div></aside>':'')+
     enquete+(L.objectifs?'<div class="objectifs"><b>À la fin de la leçon, tu sauras :</b><ul>'+L.objectifs.map(function(o){return '<li>'+o+'</li>'}).join("")+'</ul></div>':'')+
     parties+denouement+plus+carteM+(mur?VRT.verrou.mur(L,mur,A):scenesHtml+appel+A.offre(L.c,L.m,'lecon'))+'<div id="tuteurLecon"></div>'+nav+'</article></section>'+
   '<section class="grille" data-panneau="revision" hidden><aside class="sommaire"><p>L\'essentiel</p></aside><article class="carte">'+
     ''+(mur?'<p class="vide">La fiche de révision de cette leçon est réservée aux abonnés. <a href="#" data-retour-cours>Voir comment la débloquer</a>.</p>':'<div class="partie"><h2><span class="num">'+A.pic("coche",20)+'</span><span class="txt">Ce que tu dois retenir</span></h2><ul>'+L.revision.map(function(r){return '<li>'+r+'</li>'}).join("")+'</ul></div>')+
     (L.exo?'<div class="partie"><h2><span class="num">'+A.pic("crayon",18)+'</span><span class="txt">À toi de jouer</span></h2>'+L.exo+'</div>':'')+
     scenesHtml+'</article></section>'+
   '<section class="grille" data-panneau="quiz" hidden><aside class="sommaire"><p>'+(L.quiz.length||L.nq||0)+' questions</p><p id="score" class="lu"></p></aside><article class="carte" id="quiz"><div class="quiz-barre" id="quizBarre" aria-hidden="true"><i></i></div>'+
     L.quiz.map(function(q0,k){var q=A.melanger(q0);q.q=q0.q;q.e=q0.e;return '<div class="q" data-bonne="'+q.b+'"><p>'+(k+1)+'. '+q.q+'</p>'+q.r.map(function(r){return '<button type="button">'+r+'</button>'}).join("")+'<div class="expl" hidden>'+(q.e||"")+'</div></div>'}).join("")+
     (mur?'<p class="vide">Le quiz de cette leçon est réservé aux abonnés. <a href="#" data-retour-cours>Voir comment le débloquer</a>.</p>':'')+'<div class="bilan" id="bilan" hidden></div></article></section>';
  if(mur){ VRT.verrou.brancher(boite,L); $$("[data-retour-cours]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();$('[data-f=cours]').click();var m=$(".mur");if(m)m.scrollIntoView({block:"center"})})}); }
  /* « Pour aller plus loin » : 2 ressources, le reste derrière « Voir plus » (12/11/2026). */
  A.replier(document.querySelector(".res-lecon .res-g"),2,"ressources");

  A.noterJour(); A.chiffreSerie($("#serie"));

  /* Tuteur IA (Prof. Ambassa) : questions sur la leçon, quota fixé par le serveur selon la formule. */
  if(VRT.tuteur){ try{ VRT.tuteur.monter($("#tuteurLecon"),L,M,A) }catch(e){ if(window.console) console.warn("Tuteur", e) } }

  /* Kalao, la mascotte : un mot d'accueil adapté (déjà lue ? quiz déjà réussi ?) */
  if(VRT.jeu&&!mur){ var dejaLu=A.lire("lus",{})[id], qq=A.lire("quiz",{})[id];
    VRT.jeu.bulle($("#kalaoCours"), qq&&qq[0]===qq[1] ? "Te revoilà ! Tu as déjà réussi ce quiz sans faute. Une petite révision pour graver tout ça ?"
      : dejaLu ? "Content de te revoir. Après la lecture, tente le quiz : chaque étoile vaut 10 points."
      : "Salut, moi c'est Kalao ! Lis la leçon jusqu'au bout pour gagner <b>20 points</b>, puis décroche les 3 étoiles du quiz.", "salut"); }

  /* apparition douce des parties (désactivée si « réduire les animations ») */
  if("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    document.documentElement.classList.add("js");
    var rv=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("apparu");rv.unobserve(e.target)}})},{rootMargin:"0px 0px -8% 0px"});
    $$(".partie").forEach(function(p){rv.observe(p)});
    setTimeout(function(){$$(".partie").forEach(function(p){p.classList.add("apparu")})},4000); /* filet : jamais de texte caché */
  }

  /* schémas animés : chacun isolé, une erreur n'empêche pas la leçon de s'afficher */
  $$("[data-anim]").forEach(function(el){ var p=L.parties[+el.getAttribute("data-anim")]; try{ p.anim(el) }catch(e){ el.closest(".anim").hidden=true; if(window.console) console.warn("Animation", id, e) } });
  $$("[data-labo]").forEach(function(el){ var p=L.parties[+el.getAttribute("data-labo")]; try{ VRT.labo.monter(el,p.labo) }catch(e){ el.closest(".anim").hidden=true; if(window.console) console.warn("Labo", id, e) } });
  $$("[data-p3d]").forEach(function(el){ var a=el.getAttribute("data-p3d").split("-"); try{ VRT.p3d.monter(el,ouvertes[+a[0]].planches[+a[1]].modele) }catch(e){ el.closest(".p3d").hidden=true; if(window.console) console.warn("Planche 3D", id, e) } });
  /* le fil des indices s'allume à mesure que l'élève les lit */
  function allumer(f){ var n=+f.getAttribute("data-fil"), li=$('.enq-pistes [data-indice="'+n+'"]'); f.setAttribute("data-vu","1"); if(li) li.classList.add("trouve"); if(n===nFil){var fi=$(".enq-pistes .fin"); if(fi) fi.classList.add("trouve")}
    var fo=ouvertes.filter(function(p){return p.fil})[n-1].fil; (fo.verdicts||[]).forEach(function(v){var h=$('.hyp [data-h="'+v[0]+'"]'); if(!h)return; h.className='h-'+v[1]; h.querySelector('.hyp-e').textContent=ETAT[v[1]]+' · indice '+n}); }
  /* contrôle au défilement plutôt qu'IntersectionObserver : un indice plus haut que l'écran s'allume quand même */
  var filsAttente=$$(".fil"), filTic=0; function verifFils(){ filTic=0; var lim=innerHeight*0.7; filsAttente=filsAttente.filter(function(f){ if(f.getBoundingClientRect().top<lim){allumer(f);return false} return true }); if(!filsAttente.length) removeEventListener("scroll",surDefil) }
  function surDefil(){ if(!filTic) filTic=requestAnimationFrame(verifFils) } if(filsAttente.length){ addEventListener("scroll",surDefil,{passive:true}); verifFils() }
  A.boutonsImage(document.getElementById("lecon"));   /* « Enregistrer l'image » : PNG avec filigrane VÉRITAS */

  /* onglets */
  var SUR={cours:"Cours",revision:"Fiche de révision",quiz:"Quiz"};
  $$(".formats button").forEach(function(b){b.addEventListener("click",function(){
    $$(".formats button").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")});
    $$("[data-panneau]").forEach(function(p){p.hidden=p.getAttribute("data-panneau")!==b.getAttribute("data-f")});
    $("#sur").textContent=SUR[b.getAttribute("data-f")]; window.scrollTo({top:0});
  })});
  if(location.hash==="#quiz") $('[data-f=quiz]').click();

  /* sommaire actif + lecture */
  var liens=$$('[data-panneau=cours] .sommaire a'), fait=false;
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting) liens.forEach(function(a){a.classList.toggle("actif",a.getAttribute("href")==="#"+e.target.id)})})},{rootMargin:"-30% 0px -60% 0px"});
    $$('[data-panneau=cours] .partie').forEach(function(p){io.observe(p)});
  }
  var art=$('[data-panneau=cours] .carte');
  function lecture(){ var r=art.getBoundingClientRect(), h=r.height-innerHeight*.6; var p=Math.max(0,Math.min(100,Math.round((-r.top+innerHeight*.2)/Math.max(h,1)*100)));
    $("#luBar").style.width=p+"%"; $("#luTxt").textContent=p>=95?"Leçon lue":"Lecture : "+p+" %"; if(p>=95&&!fait&&!mur){fait=true;A.marquerLu(id);if(VRT.jeu)VRT.jeu.leconLue(id)} }
  addEventListener("scroll",lecture,{passive:true}); lecture();

  /* quiz */
  var bons=0,faits=0,n=L.quiz.length,combo=0,J=VRT.jeu;
  $$(".q").forEach(function(q){var b=+q.getAttribute("data-bonne");$$("button",q).forEach(function(btn,k){btn.addEventListener("click",function(){
    if(q.dataset.fait) return; q.dataset.fait="1"; faits++;
    if(k===b){btn.classList.add("ok");bons++;combo++; if(combo>=2&&J) J.toast('<b>Série de '+combo+'</b><span>bonnes réponses d\'affilée</span>',"combo");}
    else{btn.classList.add("ko");$$("button",q)[b].classList.add("ok");combo=0;q.classList.remove("secoue");void q.offsetWidth;q.classList.add("secoue")}
    $(".expl",q).hidden=false; $("#score").textContent=bons+" / "+faits;
    var bq=$("#quizBarre i"); if(bq) bq.style.transform="scaleX("+(faits/n)+")";
    if(faits===n){ A.noterQuiz(id,bons,n); var et=bons===n?3:bons>=Math.ceil(n*.6)?2:bons>0?1:0;
      var hum=bons===n?"bravo":"salut", msg=bons===n?'Parfait ! Tu maîtrises cette leçon.':bons>=n/2?'Bien joué. Relis la partie qui t\'a piégé.':'Relis le cours, puis retente ta chance : tu vas y arriver.';
      var bl=$("#bilan"); bl.hidden=false; bl.innerHTML=(J?J.mascotte(hum,96):'')+A.etoiles(et)+'<b>'+bons+' / '+n+'</b>'+msg+'<p style="margin:12px 0 0"><button type="button" class="btn-l" onclick="location.hash=\'quiz\';location.reload()">Recommencer</button> '+(suiv?'<a class="btn-l" href="lecon.html?id='+suiv+'">Leçon suivante ›</a>':'')+'</p>'+A.offre(L.c,L.m,'quiz'); bl.scrollIntoView({behavior:"smooth",block:"center"});
      if(J) J.quizFini(id,bons,n); }
  })})});

  /* vue enseignant (08/11/2026) : la barre ne « publie » plus rien en local — ce masquage ne
     changeait l'écran d'aucun élève. « Ajouter à mon manuel » envoie la partie dans le manuel de
     classe (enregistré sur le serveur) ; les élèves la lisent avec le lien élèves du manuel. */
  var ICO={lien:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',pdf:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'};
  function ic(k,t,a){return '<button type="button" class="ic" title="'+t+'" data-a="'+a+'"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[k]+'</svg><span class="vsr">'+t+'</span></button>'}
  $$('[data-panneau=cours] .partie').forEach(function(p,k){
    var d=document.createElement("div"); d.className="barre";
    d.innerHTML='<a class="mod" href="manuel.html?ajouter='+encodeURIComponent(id+"~"+k)+'" title="Envoyer cette partie dans le manuel de votre classe">Ajouter à mon manuel</a>'+ic("lien","Copier le lien","lien")+ic("pdf","Imprimer","pdf");
    p.insertBefore(d,p.firstChild);
    $('[data-a=lien]',d).addEventListener("click",function(){ var u=location.href.split("#")[0]+"#"+p.id; try{navigator.clipboard.writeText(u)}catch(e){} this.title="Lien copié"; });
    $('[data-a=pdf]',d).addEventListener("click",function(){print()});
  });
  $$(".vue button").forEach(function(b){b.addEventListener("click",function(){
    var v=b.getAttribute("data-vue"); $$(".vue button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")}); document.body.className=v;
    if(v==="prof"&&!A.lire("visite_prof",0)){ouvrir();A.ecrire("visite_prof",1)}
  })});

  /* Français, vue Enseignant : évaluer la leçon dans l'Atelier — la séquence
     vient du chapitre qui contient la leçon (table générée, cf. matiere.html). */
  (function(){var AT=(L.m==="francais"&&window.VRT_ATELIER)?VRT_ATELIER[L.c]:null; if(!AT) return;
    var ch=((window.VRT_PROG||{})[L.c]||{})["Français"]||[], ix=-1;
    ch.forEach(function(c,k){if(ix<0&&(c[1]||[]).some(function(l){return l[0]===L.n}))ix=k});
    var sq=ix>=0?AT.seq[ix]:0;
    var href='/plateforme/#composer?prog='+encodeURIComponent(AT.prog)+(sq?'&seq='+sq:'')+'&lecon='+encodeURIComponent(L.titre);
    var d=document.createElement("div"); d.className="atelier-prof";
    d.innerHTML=A.pic("plume",26)+'<div><b>Évaluer cette leçon</b>'+(sq?'L’Atelier de français ouvre l’évaluation de la séquence '+sq+' ('+esc(AT.libelle)+'), avec cette leçon dans son titre.':'L’Atelier de français ouvre une évaluation pour cette classe.')+'</div><a href="'+href+'">Composer dans l’Atelier</a>';
    var pan=$('[data-panneau=cours]'); if(pan) pan.parentNode.insertBefore(d,pan); else boite.insertBefore(d,boite.firstChild);
  })();

  /* accueil en étapes */
  var ET=[{t:"Choisissez la leçon",s:"Classe, matière, chapitre",i:"p-eleve",l:["Le rail de gauche range les matières de la classe","Chaque leçon suit la progression harmonisée du MINESEC"]},
    {t:"Adaptez-la",s:"Chaque partie a sa barre d'outils",i:"p-enseignant",l:["« Ajouter à mon manuel » range la partie dans le manuel de votre classe","Vos élèves la lisent avec le lien élèves du manuel"]},
    {t:"Faites pratiquer",s:"Révision, quiz, scène vivante",i:"m-francais",l:["La fiche de révision tient en une page","Le quiz corrige et explique chaque réponse"]},
    {t:"Imprimez si besoin",s:"PDF propre, sans menus",i:"p-parent",l:["Le bouton PDF imprime le cours seul","Pratique pour une salle sans connexion"]}],cur=0,dlg=$("#visite");
  $(".etapes").innerHTML=ET.map(function(e,k){return '<li data-i="'+k+'"><span class="n">'+(k+1)+'</span><div><b>Étape '+(k+1)+'</b><span>'+e.s+'</span></div></li>'}).join("");
  function rendre(){var e=ET[cur];$$(".etapes li").forEach(function(li,k){if(k===cur)li.setAttribute("aria-current","step");else li.removeAttribute("aria-current")});$("#visiteH").textContent=e.t;$("#visiteIco").setAttribute("href","../assets/veritas-matieres.svg#"+e.i);$("#visiteL").innerHTML=e.l.map(function(x){return "<li>"+x+"</li>"}).join("");$("#visiteS").textContent=cur===ET.length-1?"Commencer":"Suivant"}
  function ouvrir(){cur=0;rendre();if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","")}
  $$(".etapes li").forEach(function(li){li.addEventListener("click",function(){cur=+li.getAttribute("data-i");rendre()})});
  $("#visiteS").addEventListener("click",function(){if(cur<ET.length-1){cur++;rendre()}else dlg.close()});
  $(".fermer").addEventListener("click",function(){dlg.close()});
  }
  if(L.verrou&&window.VRT&&VRT.verrou){ boite.innerHTML='<p class="vide">Chargement de la leçon…</p>'; VRT.verrou.ouvrir(L,demarrer); } else demarrer(null);
})();
</script>
