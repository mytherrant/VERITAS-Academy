    niveau: tle
    mode: lecture
    actif: false
    bloque: "PDF de pages à produire depuis le .docx"
    kinds: [livret]
    prix: 1500
    pages_libres: 8
    source: { racine: docx2, document: "Bord_Tle_A_CORRIGE.docx" }

  # ── Livrets 2nd cycle en .docx — mode LECTURE en attendant l'interactif ────
  livret-1ere:
    titre: "Livret d'activités 1ʳᵉ A"
    niveau: 1ere
    mode: lecture
    actif: false
    bloque: "PDF de pages à produire depuis le .docx"
    kinds: [livret]
