    source: { racine: docx2, document: "Livret_activites_1ere_A.docx" }

  livret-tle:
    titre: "Livret d'activités Tᵉ A"
    niveau: tle
    mode: lecture
    actif: false
    bloque: "PDF de pages à produire depuis le .docx"
    kinds: [livret]
    pages_libres: 6
    source: { racine: docx2, document: "Livret_activites_Tle_A.docx" }

  # ── Cahiers d'œuvre intégrale ──────────────────────────────────────────────
  # Quatre œuvres au programme, un cahier chacune. Sources en pack Markdown
  # (content/*.md + render.js), donc rendables en PDF sans repasser par Word.
