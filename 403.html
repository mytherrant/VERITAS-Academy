<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Accès refusé — Centre VÉRITAS</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{ --navy:#142554; --navy-deep:#0D1B3E; --gold:#FFC93C; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    color:#fff; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; text-align:center;
  }
  .box{max-width:440px}
  .code{font-size:64px;font-weight:800;color:var(--gold);line-height:1;letter-spacing:-2px}
  h1{font-size:20px;margin:14px 0 10px;font-weight:700}
  p{font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.82)}
  a.btn{
    display:inline-block;margin-top:22px;padding:13px 26px;border-radius:12px;
    background:var(--gold);color:var(--navy);text-decoration:none;font-weight:800;font-size:14px;
    min-height:44px;line-height:1.4;
  }
  .rule{width:46px;height:3px;background:var(--gold);border-radius:99px;margin:18px auto 0}
</style>
</head>
<body>
  <div class="box">
    <div class="code">403</div>
    <h1>Cette ressource est protégée</h1>
    <p>Vous n'avez pas l'autorisation d'accéder à cette adresse. Si vous cherchiez un cours,
       une annale ou votre espace personnel, revenez à l'accueil : tout y est accessible.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
    <div class="rule"></div>
  </div>
</body>
</html>
