# ============================================================
# VÉRITAS — Déploiement automatique vers veritas-school.com
# Se déclenche à chaque push sur master qui touche ces fichiers
# ============================================================
name: 🚀 Déployer sur veritas-school.com

on:
  push:
    branches: [master]
    paths:
      - 'VERITAS_v1.2.html'
      - 'VERITAS_v1.1.html'
      - 'vitrine.html'
      - 'VERITAS_Promo_Video.html'
      - 'reset.html'
      - 'admin-validation.html'
      - 'manuels.html'
      - '403.html'
      - 'index.php'
      - 'app.css'
      - 'app.js'
      - '.htaccess'
      - 'api/**'
      - 'evaluations/**'
      - 'uploads/oeuvres/**'
      - 'oeuvres/**'
      - 'ressources/**'
      - 'decouvrir/**'
      - 'niveaux/**'
      - 'outils/**'
      - 'corriges/**'
      - 'chunks/**'
      - 'assets/**'
      - 'legal/**'
      - 'constellation.html'
      - 'eleve/**'
      - 'enseignant/**'
      - 'flash/**'
      - 'parcours/**'
      - 'adopter/**'
      - 'cours/**'
      - 'campus/**'
      - 'Logo détouré.png'
      - 'og-image.jpg'
      - 'ambassa-avatar.jpg'
      - 'ambassa-avatar.png'
      - 'sitemap.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'ai.txt'

  # Lancement manuel depuis GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  deploy:
    name: 📤 Upload vers LWS (FTP)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ── 🧪 Garde-fou syntaxe — bloque le déploiement si PHP ou JS est invalide ──
      # Ajouté après l'incident HTTP 500 (directive .htaccess incompatible déployée
      # sans vérification) : aucune erreur de syntaxe ne doit plus atteindre la prod.
      - name: 🧪 Vérifier la syntaxe (PHP + JS) avant déploiement
        run: |
          php_fail=0
          echo "→ Lint PHP (php -l) sur api/*.php et api/campus/*.php"
          if command -v php >/dev/null 2>&1; then
            for f in api/*.php api/campus/*.php; do
              [ -f "$f" ] || continue
              if ! php -l "$f"; then php_fail=1; fi
            done
          else
            echo "::warning::php introuvable sur le runner — lint PHP ignoré"
          fi
          js_fail=0
          echo "→ Lint JS (node --check) sur app.js, sw.js, assets/*.js et chunks/*.js"
          for j in app.js sw.js $(ls assets/*.js 2>/dev/null) $(ls chunks/*.js 2>/dev/null); do
            [ -f "$j" ] || continue
            if ! node --check "$j"; then js_fail=1; fi
          done
          if [ "$php_fail" != "0" ] || [ "$js_fail" != "0" ]; then
            echo "::error title=Syntaxe invalide::Déploiement ANNULÉ — corrigez les erreurs ci-dessus."
            exit 1
          fi
          echo "✅ Syntaxe PHP + JS valide — déploiement autorisé."

          # ── Cohérence de version des assets (coquille ⇄ service worker) ──
          # La coquille demande /app.js?v=X ; sw.js précharge /app.js?v=ASSET_VER
          # dérivé de CACHE_VERSION. Constaté en production le 04/08/2026 : les
          # deux avaient divergé (1.11.3 vs 1.13.0). Conséquences silencieuses —
          # ~3,7 Mo préchargés pour une URL que personne ne demande, et surtout
          # le mode hors ligne inopérant, la page réclamant une URL absente du
          # cache. Rien ne plante : c'est précisément pour ça qu'on l'automatise.
          SHELL_VER=$(grep -o 'app\.js?v=[0-9.]*' VERITAS_v1.2.html | head -1 | sed 's/.*v=//')
          SW_VER=$(grep -o "CACHE_VERSION = 'veritas-v[0-9.]*'" sw.js | head -1 | sed "s/.*veritas-v//;s/'//")
          if [ -n "$SHELL_VER" ] && [ -n "$SW_VER" ] && [ "$SHELL_VER" != "$SW_VER" ]; then
            echo "::error title=Versions d'assets divergentes::VERITAS_v1.2.html demande app.js?v=$SHELL_VER mais sw.js précharge la version $SW_VER. Alignez les deux (et bumpez-les à chaque modification d'app.js)."
            exit 1
          fi
          echo "✅ Version d'assets cohérente ($SHELL_VER) — coquille et service worker alignés."

      - name: 📋 Préparer les fichiers
        run: |
          mkdir -p deploy/api \
                   deploy/data \
                   deploy/api/data \
                   deploy/uploads/veritas \
                   deploy/uploads/media \
                   deploy/uploads/video \
                   deploy/uploads/epreuve \
                   deploy/uploads/cours \
                   deploy/uploads/ressource \
                   deploy/uploads/image \
                   deploy/uploads/protected/enseignant

          # ── Verrous des dossiers protégés ───────────────────────
          # Les .htaccess « Require all denied » DOIVENT accompagner les dossiers
          # protégés : sans eux, un Guide déposé par FTP serait téléchargeable par
          # son URL, et la porte api/teacher_access.php ne servirait à rien.
          for d in uploads/protected uploads/protected/enseignant; do
            if [ -f "$d/.htaccess" ]; then
              cp "$d/.htaccess" "deploy/$d/.htaccess"
              echo "  ✓ $d/.htaccess (accès HTTP direct interdit)"
            else
              echo "::warning title=Dossier protégé sans verrou::$d/.htaccess manquant"
            fi
          done
          [ -f uploads/protected/enseignant/LISEZMOI.txt ] && cp uploads/protected/enseignant/LISEZMOI.txt deploy/uploads/protected/enseignant/

          # ── Application principale ──────────────────────────────
          # app.html → servi par index.php (wrapper no-cache LiteSpeed)
          # index.html → accès direct sans PHP
          # Priorité v1.2 si présent, sinon fallback v1.1
          if [ -f "VERITAS_v1.2.html" ]; then
            cp VERITAS_v1.2.html deploy/app.html
            echo "  ✓ VERITAS_v1.2.html → app.html"
          else
            cp VERITAS_v1.1.html deploy/app.html
            echo "  ✓ VERITAS_v1.1.html → app.html"
          fi

          # ── Vitrine publique (refonte août 2026) ────────────────────────
          # « / » sert désormais la vitrine (via index.php), et non plus la
          # coquille applicative. index.html en reçoit une copie pour l'accès
          # direct sans PHP. L'application reste sur app.html : ne PAS la
          # remplacer ici, les espaces connectés et les 64 pages statiques y
          # renvoient.  Échec bruyant : un index.html contenant l'application
          # alors qu'index.php sert la vitrine donnerait deux accueils
          # différents selon l'URL tapée, et le bug serait invisible en CI.
          if [ -f vitrine.html ]; then
            cp vitrine.html deploy/vitrine.html
            cp vitrine.html deploy/index.html
            echo "  ✓ vitrine.html → vitrine.html + index.html (accueil public)"
          else
            echo "::error title=Vitrine manquante::vitrine.html est absent du dépôt alors qu'index.php la sert en racine. Le site s'ouvrirait sur l'application. Déploiement ANNULÉ."
            exit 1
          fi
          cp index.php         deploy/index.php
          # v1.2.2 : CSS + JS principaux extraits (cacheables séparément → 1er chargement allégé)
          if [ -f app.css ]; then cp app.css deploy/; echo "  ✓ app.css"; fi
          if [ -f app.js ];  then cp app.js  deploy/; echo "  ✓ app.js"; fi

          # Logo
          if [ -f "Logo détouré.png" ]; then cp "Logo détouré.png" deploy/; fi

          # ── Bannière de partage (og:image) ──────────────────────
          # <meta property="og:image"> pointait vers og-image.jpg… qui n'était
          # PAS déployé (404). Résultat : aucun aperçu lors d'un partage
          # WhatsApp/Facebook — sur un site dont l'acquisition passe par le
          # partage. Ne pas retirer.
          if [ -f og-image.jpg ]; then cp og-image.jpg deploy/; echo "  ✓ og-image.jpg (aperçu de partage)"; fi

          # Avatar IA Ambassa (portrait — .png ou .jpg selon disponibilité)
          if [ -f "ambassa-avatar.png" ]; then cp "ambassa-avatar.png" deploy/; echo "  ✓ ambassa-avatar.png"; fi
          if [ -f "ambassa-avatar.jpg" ]; then cp "ambassa-avatar.jpg" deploy/; echo "  ✓ ambassa-avatar.jpg"; fi

          # .htaccess (sécurité + cache + MIME)
          if [ -f .htaccess ]; then cp .htaccess deploy/; fi

          # ── SEO + PWA (sitemap, robots, manifest) ───────────────
          for f in sitemap.xml sitemap-index.xml robots.txt manifest.webmanifest sw.js ai.txt; do
            [ -f "$f" ] && cp "$f" deploy/ && echo "  ✓ $f"
          done

          # ── v1.9 (#7) Pages SEO statiques des épreuves gratuites ──
          # NON-BLOQUANT : un échec n'interrompt JAMAIS le déploiement.
          if node tools/build_seo.cjs --base https://veritas-school.com; then
            [ -d seo ] && cp -r seo deploy/ && echo "  ✓ seo/ ($(ls seo | wc -l) fichiers)"
          else
            echo "  ⚠ build_seo ignoré (non bloquant)"
          fi

          # ── Pages SEO des ŒUVRES au programme (analyses/fiches par œuvre) ──
          if [ -d oeuvres ]; then cp -r oeuvres deploy/ && echo "  ✓ oeuvres/ ($(ls oeuvres | wc -l) fichiers)"; fi
          if [ -d ressources ]; then cp -r ressources deploy/ && echo "  ✓ ressources/ ($(ls ressources | wc -l) fichiers)"; fi
          if [ -d decouvrir ]; then cp -r decouvrir deploy/ && echo "  ✓ decouvrir/ ($(ls decouvrir | wc -l) fichiers)"; fi
          if [ -d niveaux ]; then cp -r niveaux deploy/ && echo "  ✓ niveaux/ ($(ls niveaux | wc -l) fichiers)"; fi
          # ── Outils gratuits (calculateurs autonomes = aimants SEO) ──
          # _style.txt est une note de travail : elle reste hors du déploiement.
          if [ -d outils ]; then
            cp -r outils deploy/ && rm -f deploy/outils/_style.txt
            echo "  ✓ outils/ ($(ls outils/*.html outils/*.xml 2>/dev/null | wc -l) fichiers publics)"
          fi

          # ── Corrigés des manuels (cible des astuces 🌐 imprimées) ──
          # corriges/ = hub + 1 dossier par niveau (6e…tle) + pages EST.
          # Généré par tools/build_corriges.py depuis les Guides pédagogiques
          # et les sources des packs ; les .html sont commités tels quels.
          if [ -d corriges ]; then
            cp -r corriges deploy/
            echo "  ✓ corriges/ ($(find corriges -name '*.html' | wc -l) pages)"
          fi

          # ── Constellation VÉRITAS : écosystème autour du cahier papier ──
          # assets/ = feuille de style + JS COMMUNS à toutes les pages statiques
          # (corriges/, eleve/, enseignant/, flash/, constellation.html).
          # ⚠️ Sans assets/, toutes ces pages s'affichent sans style.
          if [ -d assets ]; then
            cp -r assets deploy/
            echo "  ✓ assets/ ($(ls assets | wc -l) fichiers communs)"
          fi

          # ── Modules chargés à la demande (v1.14) ────────────────────────
          # chunks/ = catalogues sortis d'app.js pour alléger le démarrage.
          # ⚠️ Sans ce dossier sur le serveur, les ressources pédagogiques et
          # les analyses littéraires ne s'ouvrent plus : _lazyChunk() échoue.
          if [ -d chunks ]; then
            cp -r chunks deploy/
            echo "  ✓ chunks/ ($(ls chunks/*.js 2>/dev/null | wc -l) modules différés)"
          fi
          # ── Pages légales (mentions, CGV, charte pédagogique) ──────────
          # ⚠️ ÉCHEC BRUYANT. Le pied de page de la vitrine et l'écran
          # enseignants pointent vers ces trois pages ; build_vitrine.js refuse
          # même de construire si elles manquent du dépôt. Les oublier ici
          # donnerait des CGV en 404 sur un site qui encaisse — la pire des
          # combinaisons : le lien promet, le serveur nie.
          # _gabarit.txt est une note de travail : elle reste hors ligne.
          if [ -d legal ]; then
            mkdir -p deploy/legal
            for f in legal/*.html; do
              [ -f "$f" ] || continue
              cp "$f" deploy/legal/
            done
            n=$(ls deploy/legal/*.html 2>/dev/null | wc -l)
            if [ "$n" -lt 3 ]; then
              echo "::error title=Pages légales incomplètes::$n page(s) dans legal/ au lieu de 3 (mentions, CGV, charte). Déploiement ANNULÉ."
              exit 1
            fi
            echo "  ✓ legal/ ($n pages : mentions, CGV, charte)"
          else
            echo "::error title=Pages légales absentes::legal/ est introuvable alors que la vitrine y renvoie. Déploiement ANNULÉ."
            exit 1
          fi

          if [ -f constellation.html ]; then cp constellation.html deploy/; echo "  ✓ constellation.html"; fi
          for d in eleve enseignant flash parcours adopter; do
            if [ -d "$d" ]; then cp -r "$d" deploy/; echo "  ✓ $d/"; fi
          done

          # ── VÉRITAS Campus (SaaS multi-établissement) ───────────
          # Front : campus/*.html + campus.js + config.js.
          # ⚠️ config.js porte le MODE d'hébergement ; il part tel quel, c'est
          #    le fichier que l'on édite pour une install mono-établissement.
          #    Les .md (offre, déploiement) restent internes : pas en ligne.
          if [ -d campus ]; then
            mkdir -p deploy/campus
            for f in campus/*.html campus/*.js campus/*.css; do
              [ -f "$f" ] && cp "$f" deploy/campus/
            done
            echo "  ✓ campus/ ($(ls deploy/campus | wc -l) fichiers publics, docs internes exclues)"
          fi

          # ── Vidéo promotionnelle ───────────────────────────────
          if [ -f VERITAS_Promo_Video.html ]; then
            cp VERITAS_Promo_Video.html deploy/
            echo "  ✓ VERITAS_Promo_Video.html"
          fi

          # ── Page d'erreur 403 dédiée (cible de ErrorDocument) ───
          # Sans elle, .htaccess pointerait vers un fichier absent et Apache
          # retomberait sur sa page par défaut.
          if [ -f 403.html ]; then cp 403.html deploy/; echo "  ✓ 403.html"; fi

          # ── Page des corrigés des manuels (manuels.html) ────────
          # ⚠️ Les QR codes IMPRIMÉS dans les manuels 1er cycle pointent ici.
          # Le fichier n'était pas déployé → chaque élève scannant son manuel
          # tombait sur une 404. Ne pas retirer de cette liste.
          if [ -f manuels.html ]; then
            cp manuels.html deploy/
            echo "  ✓ manuels.html (cible des QR imprimés)"
          fi

          # ── Page de réparation d'urgence (reset.html) ──────────
          # Accessible via https://veritas-school.com/reset.html
          # Désinscrit le SW + vide le cache en 1 clic (pour debug user)
          if [ -f reset.html ]; then
            cp reset.html deploy/
            echo "  ✓ reset.html"
          fi

          # ── API PHP ─────────────────────────────────────────────
          # config.php = credentials MySQL → NE JAMAIS déployer via CI
          # payment_config.php = credentials Orange/MTN → NE JAMAIS déployer via CI
          # database_mysql.sql = schéma de référence → NE PAS exposer publiquement
          for f in \
            api/db.php \
            api/upload.php \
            api/config_sync.php \
            api/sync.php \
            api/files.php \
            api/upload_file.php \
            api/upload_video.php \
            api/news_proxy.php \
            api/public_data.php \
            api/payment_orange.php \
            api/payment_mtn.php \
            api/payment_campay.php \
            api/payment_camerpay.php \
            api/_pay_funds_lib.php \
            api/ia_proxy.php \
            api/rag.php \
            api/student_data.php \
            api/_json_boot.php \
            api/_auth_lib.php \
            api/content.php \
            api/migrate_protected.php \
            api/db_sql.php \
            api/admin_validate.php \
            api/stats.php \
            api/teacher_access.php \
            api/secure_pdf.php \
            api/demandes.php; do
            # ⚠️ ÉCHEC BRUYANT, et pas un « [ -f ] && cp » silencieux.
            #    Quatre incidents ont la même cause : un endpoint écrit, ajouté
            #    à cette liste, mais jamais « git add » — la CI ne le voit donc
            #    pas, la garde saute sans un mot, et la fonctionnalité est
            #    déclarée livrée alors que le fichier n'existe pas en ligne
            #    (404 masqués par le cache LiteSpeed). Un chemin listé ici est
            #    une PROMESSE : s'il manque, le déploiement s'arrête.
            if [ ! -f "$f" ]; then
              echo "::error title=Endpoint manquant::$f est listé pour le déploiement mais absent du dépôt (oubli de 'git add' ?). Déploiement ANNULÉ — sinon l'API partirait incomplète et les 404 seraient invisibles."
              exit 1
            fi
            cp "$f" deploy/api/ && echo "  ✓ $f"
          done

          # ── Backend VÉRITAS Campus (api/campus/) ────────────────
          # TOUT le dossier part : index.php est le front controller, mais il
          # require les _*.php — en oublier un donne un 500 muet en production.
          # Le .htaccess est OBLIGATOIRE : c'est lui qui interdit l'accès direct
          # aux _*.php et à schema.sql. Sans lui, le déploiement échoue ici
          # plutôt que d'exposer le schéma de la base.
          if [ -d api/campus ]; then
            if [ ! -f api/campus/.htaccess ]; then
              echo "::error title=Campus sans verrou::api/campus/.htaccess manquant — les _*.php et schema.sql seraient lisibles en ligne. Déploiement ANNULÉ."
              exit 1
            fi
            mkdir -p deploy/api/campus
            # _config.php porte les identifiants MySQL et le jeton
            # d'installation : il est gitignoré (dépôt public) et vit
            # uniquement sur le serveur. La CI ne l'a donc pas — et ne doit
            # surtout pas l'écraser avec un fichier vide.
            for f in api/campus/*.php; do
              case "$(basename "$f")" in
                _config.php) echo "  ↷ _config.php ignoré (secrets, reste sur le serveur)" ;;
                *) cp "$f" deploy/api/campus/ ;;
              esac
            done
            cp api/campus/schema.sql deploy/api/campus/
            cp api/campus/.htaccess deploy/api/campus/
            echo "  ✓ api/campus/ ($(ls deploy/api/campus/*.php | wc -l) fichiers PHP + schema.sql + verrou)"
          fi

          # ── Page admin de validation des réponses IA (Plan Élite) ─
          if [ -f admin-validation.html ]; then
            cp admin-validation.html deploy/
            echo "  ✓ admin-validation.html"
          fi

          # ── Répertoire data protégé (veritas_db.json) ──────────
          if [ -f api/data/index.php ]; then
            cp api/data/index.php deploy/api/data/
          fi
          # ── SÉCURITÉ CamPay : bloquer l'accès HTTP direct à TOUT api/data/ ──
          #    (jeton CamPay, états de paiement/PII sous payments/, backups).
          #    Sans ce .htaccess, /api/data/payments/*.json serait téléchargeable
          #    à des URL prévisibles puisque le dépôt est public.
          if [ -f api/data/.htaccess ]; then
            cp api/data/.htaccess deploy/api/data/
            echo "  ✓ api/data/.htaccess (bloque jeton CamPay + PII paiements)"
          fi
          # ── v1.2.1 : protéger le dossier data/ RACINE où db.php écrit veritas_db.json ──
          #    Sans .htaccess ici, /data/veritas_db.json serait téléchargeable directement (toute la base).
          if [ -f data/.htaccess ]; then
            cp data/.htaccess deploy/data/
            echo "  ✓ data/.htaccess (bloque le téléchargement direct de la base)"
          fi
          printf '<?php http_response_code(403); exit;' > deploy/data/index.php

          # ── Évaluations et cours interactifs ────────────────────
          if [ -d evaluations ]; then cp -r evaluations/ deploy/evaluations/; fi
          if [ -d cours ];       then cp -r cours/       deploy/cours/;       fi

          # ── Couvertures des œuvres littéraires (v1.2.2) ─────────
          if [ -d uploads/oeuvres ]; then
            mkdir -p deploy/uploads/oeuvres
            cp uploads/oeuvres/* deploy/uploads/oeuvres/ 2>/dev/null || true
            echo "  ✓ uploads/oeuvres/ ($(ls uploads/oeuvres | wc -l) couvertures)"
          fi

          # Placeholders uploads (vides au départ, gérés par PHP)
          touch deploy/uploads/.gitkeep
          touch deploy/uploads/veritas/.gitkeep

          echo ""
          echo "✅ Fichiers prêts pour déploiement :"
          find deploy -type f | sort

      # ── 🗜️ Minifier app.js déployé (réduit le poids + le parsing au 1er chargement) ──
      # On minifie UNIQUEMENT la copie deploy/ (la source app.js reste lisible).
      # Mode SÛR : whitespace + syntaxe, SANS renommage d'identifiants (sinon les
      # onclick="fonction()" du HTML casseraient). Repli automatique si invalide.
      - name: 🗜️ Minifier app.js (mode sûr, sans renommage)
        run: |
          if [ -f deploy/app.js ]; then
            before=$(wc -c < deploy/app.js)
            if npx --yes esbuild deploy/app.js --minify-whitespace --minify-syntax --legal-comments=none --outfile=deploy/app.min.js 2>/dev/null \
               && node --check deploy/app.min.js && [ -s deploy/app.min.js ]; then
              mv deploy/app.min.js deploy/app.js
              after=$(wc -c < deploy/app.js)
              echo "✅ app.js minifié : ${before} → ${after} octets"
            else
              echo "::warning title=Minification ignorée::Sortie esbuild invalide — app.js original conservé (déploiement sûr)."
              rm -f deploy/app.min.js
            fi
          fi

      - name: 🔗 Aligner les cache-busters de tous les assets
        run: |
          # Les ?v= de /assets/*.css|js étaient maintenus À LA MAIN, page par page,
          # et ils ont dérivé : app.js en 1.17.2 pendant que veritas-ui.js restait
          # en 1.16.0 sur 64 pages, veritas-pages.css en 1.16.1, motion en 1.16.2.
          # Or .htaccess sert ces fichiers en « max-age=31536000, immutable » : un
          # appareil déjà venu gardait donc l'ancienne version PENDANT UN AN, sans
          # autre recours que vider son cache — le symptôme rapporté en août 2026.
          # On réaligne tout sur la version de la coquille, dans deploy/ seulement.
          BASE=$(grep -o 'app\.js?v=[0-9.]*' deploy/app.html | head -1 | sed 's/.*v=//')
          if [ -z "$BASE" ]; then
            echo "::error title=Version d'asset introuvable::Impossible de lire app.js?v= dans deploy/app.html."
            exit 1
          fi
          # Le numéro écrit à la main ne suffit pas : on peut modifier app.js sans
          # le bumper (deux sessions qui travaillent le même jour, un correctif
          # posé après le bump…). L'URL reste alors identique alors que le contenu
          # a changé — et le service worker, qui met les scripts en cache PAR URL,
          # continue de servir l'ancien code. Constaté le 12/08/2026 : app.js
          # remplacé sur le serveur, navigateur toujours sur la version d'avant.
          # On suffixe donc la version d'une empreinte du contenu RÉELLEMENT servi
          # (après minification) : un octet qui change ⇒ une URL neuve, toujours.
          # Suffixe purement NUMÉRIQUE : la coquille lit sa version avec
          # /app\.js\?v=([0-9.]+)/ (window._VRT_ASSET_VER, qui sert aux chunks),
          # un caractère hexadécimal casserait cette lecture en silence.
          EMPREINTE=$(cat deploy/app.js deploy/app.css 2>/dev/null | sha1sum | tr -dc '0-9' | cut -c1-6)
          [ -z "$EMPREINTE" ] && EMPREINTE=0
          VER="$BASE.$EMPREINTE"
          echo "   Version de base $BASE + empreinte du contenu → $VER"
          # Ancrage STRICT sur « .css?v= » / « .js?v= ». Un remplacement sur le
          # numéro nu a déjà mangé les paramètres d'un arc SVG (symbole lc-shield,
          # bump 1.17.0 → 1.17.1) : ne jamais élargir ce motif.
          n=0
          while IFS= read -r f; do
            if grep -qE '\.(css|js)\?v=[0-9.]+' "$f"; then
              sed -i -E "s/\.(css|js)\?v=[0-9.]+/.\1?v=$VER/g" "$f"
              n=$((n+1))
            fi
          done < <(find deploy -type f \( -name '*.html' -o -name '*.php' \))
          # Le service worker doit suivre : il DÉRIVE ses URLs de préchargement de
          # CACHE_VERSION (ASSET_VER), et purge à l'activation tout cache dont la
          # clé ne commence pas par cette valeur. Le laisser en arrière lui ferait
          # précharger une URL désormais inexistante — et surtout conserver les
          # caches de la version précédente.
          if [ -f deploy/sw.js ]; then
            sed -i -E "s/(const CACHE_VERSION = 'veritas-v)[0-9.]+(')/\1$VER\2/" deploy/sw.js
            SWV=$(grep -o "veritas-v[0-9.]*" deploy/sw.js | head -1 | sed 's/veritas-v//')
            if [ "$SWV" != "$VER" ]; then
              echo "::error title=Service worker non aligné::CACHE_VERSION vaut '$SWV' au lieu de '$VER' — le cache client ne serait pas purgé."
              exit 1
            fi
            echo "   Service worker aligné : veritas-v$VER"
          fi
          echo "✅ Cache-busters alignés sur $VER dans $n fichier(s)."
          # ── Le trou de la passoire : un asset SANS ?v= du tout ────────────
          # Le remplacement ci-dessus n'attrape que les URLs qui portent déjà
          # « ?v= ». Une feuille appelée « /assets/veritas-pages.css » toute
          # nue traverse donc l'étape sans être touchée… et .htaccess la sert
          # en « immutable, max-age=1 an ». Constaté le 14/08/2026 : les 56
          # pages de corrigés étaient dans ce cas, la charte unifiée ne les
          # atteignait pas. Aucun symptôme visible : la page s'affiche, avec
          # l'ancienne feuille. On refuse désormais de déployer ça.
          nus=$(grep -rhoE '(src|href)="/assets/[A-Za-z0-9_.-]+\.(css|js)"' deploy \
                  --include='*.html' --include='*.php' | sort -u | tr '\n' ' ')
          if [ -n "$nus" ]; then
            echo "::error title=Asset sans cache-buster::$nus — servis « immutable 1 an », donc figés chez tout visiteur déjà venu. Ajoutez ?v= dans le générateur ou la page. Déploiement ANNULÉ."
            exit 1
          fi
          echo "   Aucun asset servi sans ?v= — rien ne restera figé un an."
          reste=$(grep -rhoE '\.(css|js)\?v=[0-9.]+' deploy --include='*.html' --include='*.php' | grep -v "v=$VER" | sort -u | tr '\n' ' ')
          if [ -n "$reste" ]; then
            echo "::warning title=Versions résiduelles::$reste"
          else
            echo "   Aucune version résiduelle — tous les assets partagent $VER."
          fi

      - name: 🚀 Déployer via FTP vers veritas-school.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server:   ftp.veritas-school.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir:  ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.gitkeep
          log-level: standard

      - name: 🔎 Vérifier le RAG (biblio_index.db présent sur le serveur)
        if: always()
        run: |
          echo "Vérification de l'index RAG sur https://veritas-school.com ..."
          RESP=$(curl -s --max-time 25 "https://veritas-school.com/api/rag.php?q=cameroun+minesec+francais&limit=1" || echo "")
          echo "Réponse rag.php : ${RESP:0:300}"
          if echo "$RESP" | grep -qE '"ok"[[:space:]]*:[[:space:]]*true'; then
            echo "✅ RAG actif : biblio_index.db répond sur le serveur."
          else
            echo "::warning title=RAG inactif (corpus absent)::biblio_index.db n'est PAS sur le serveur — l'IA répond SANS le corpus MINESEC. Il est gitignoré (22 Mo) donc jamais déployé par la CI : uploadez-le manuellement en FTP vers …/api/data/biblio_index.db. Régénérez-le au besoin avec 'python index_corpus.py'."
          fi

      - name: 🔁 Rappel — version du Service Worker
        if: always()
        run: |
          SW_VER=$(grep -oE "veritas-v[0-9]+\.[0-9]+(\.[0-9]+)?" sw.js | head -1)
          echo "Service Worker déployé : ${SW_VER:-inconnu}"
          echo "::notice title=Service Worker (cache)::Incrémentez CACHE_VERSION dans sw.js à CHAQUE déploiement de contenu, sinon les appareils gardent l'ancienne version en cache. Version actuelle : ${SW_VER:-inconnu}."

      - name: ✅ Résumé du déploiement
        if: success()
        run: |
          echo "🎉 Déploiement réussi sur https://veritas-school.com"
          echo "   app.html / index.html → VÉRITAS v1.2"
          echo "   index.php             → wrapper no-cache LiteSpeed"
          echo "   api/db.php            → persistance JSON LWS"
          echo "   api/upload.php        → upload fichiers LWS"
          echo "   api/sync.php          → sync legacy (compatibilité)"
          echo "   Déployé le : $(date '+%d/%m/%Y à %H:%M:%S UTC')"
