# ============================================================
# VÉRITAS — Déploiement automatique vers veritas-school.com
# Se déclenche à chaque push sur master qui touche ces fichiers
# ============================================================
name: 🚀 Déployer sur veritas-school.com

on:
  push:
    branches: [master]
    paths:
      - 'VERITAS_v1.2.html'
      - 'VERITAS_v1.1.html'
      - 'vitrine.html'
      - 'VERITAS_Promo_Video.html'
      - 'reset.html'
      - 'admin-validation.html'
      - 'manuels.html'
      - '403.html'
      - '404.html'
      - 'index.php'
      - 'app.css'
      - 'app.js'
      - '.htaccess'
      - 'api/**'
      - 'evaluations/**'
      - 'uploads/oeuvres/**'
      # Les VERROUS des dossiers payants. Absents de cette liste jusqu'au
      # 20/08/2026 : la CI les COPIE (voir l'etape « Verrous des dossiers
      # proteges ») mais ne se reveillait jamais quand ils changeaient.
      # Consequence constatee : le correctif du .htaccess racine est reste
      # non deploye, et /uploads/protected/** a repondu 500 en production
      # — les livrets vendus n'etaient gardes que par cette erreur.
      - 'uploads/protected/**'
      - 'oeuvres/**'
      - 'ressources/**'
      - 'decouvrir/**'
      - 'niveaux/**'
      - 'outils/**'
      - 'corriges/**'
      - 'livrets/**'
      - 'd/**'
      - 'chunks/**'
      - 'assets/**'
      - 'legal/**'
      - 'constellation.html'
      - 'plan.html'
      - 'eleve/**'
      - 'enseignant/**'
      - 'flash/**'
      - 'parcours/**'
      - 'adopter/**'
      - 'cours/**'
      - 'campus/**'
      - 'plateforme/**'
      # NOTE : les corpus (corpus_minesec.json, citations_minesec.json) ne
      # figurent PAS ici. Ils sont gitignores — 1040 textes et 137 citations,
      # c'est la marchandise, et ce depot est PUBLIC. Ils n'arrivent donc
      # jamais par la CI : ils sont televerses une fois en FTP dans api/data/
      # (dossier « Require all denied »). dangerous-clean-slate est a false,
      # ils survivent aux deploiements suivants.
      - 'Logo détouré.png'
      - 'og-image.jpg'
      - 'ambassa-avatar.jpg'
      - 'ambassa-avatar.png'
      - 'sitemap.xml'
      - 'sitemap-index.xml'
      - 'robots.txt'
      - 'catalogue_livres.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'ai.txt'

  # Lancement manuel depuis GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  deploy:
    name: 📤 Upload vers LWS (FTP)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      # ── 🧭 EN PREMIER : ce que la CI exécute existe-t-il seulement ? ──────────
      # Trois fois ce dépôt a appelé un banc absent du checkout. Deux formes :
      # le script manque et l'exécution s'arrête (rouge, réparable) ; ou il manque
      # derrière un « [ -f … ] && » et le contrôle SAUTE SANS UN MOT — le
      # déploiement passe au vert en ayant vérifié une chose de moins.
      # Ce pas lit deploy.yml, relève tout ce qu'il lance depuis tests/ et tools/,
      # et exige que git le connaisse. Il vient AVANT les autres : un garde-fou
      # qu'on croit avoir n'est pas un garde-fou.
      - name: 🧭 Chaque banc appelé est-il bien dans le dépôt ?
        run: node tests/ci_scripts_suivis.cjs

      # ── 🔢 « On n'invente ni activité ni statistique » ────────────────────
      # Le 28/08/2026 la vitrine annonçait « 3 854 exercices corrigés » à onze
      # endroits, méta-description comprise, et une répartition par classe dont
      # une seule des sept valeurs correspondait à quelque chose. Ce pas
      # RECOMPTE depuis les pages de corriges/ que la CI déploie, et refuse un
      # chiffre que le contenu ne porte pas.
      - name: 🔢 Les chiffres annoncés se recomptent-ils ?
        run: node tests/chiffres_annonces.cjs

      # ── 🧪 Garde-fou syntaxe — bloque le déploiement si PHP ou JS est invalide ──
      # Ajouté après l'incident HTTP 500 (directive .htaccess incompatible déployée
      # sans vérification) : aucune erreur de syntaxe ne doit plus atteindre la prod.
      - name: 🧪 Vérifier la syntaxe (PHP + JS) avant déploiement
        run: |
          php_fail=0
          echo "→ Lint PHP (php -l) sur api/*.php et api/campus/*.php"
          if command -v php >/dev/null 2>&1; then
            for f in api/*.php api/campus/*.php; do
              [ -f "$f" ] || continue
              if ! php -l "$f"; then php_fail=1; fi
            done
          else
            echo "::warning::php introuvable sur le runner — lint PHP ignoré"
          fi
          js_fail=0
          echo "→ Lint JS (node --check) sur app.js, sw.js, assets/*.js et chunks/*.js"
          for j in app.js sw.js $(ls assets/*.js 2>/dev/null) $(ls chunks/*.js 2>/dev/null); do
            [ -f "$j" ] || continue
            if ! node --check "$j"; then js_fail=1; fi
          done
          if [ "$php_fail" != "0" ] || [ "$js_fail" != "0" ]; then
            echo "::error title=Syntaxe invalide::Déploiement ANNULÉ — corrigez les erreurs ci-dessus."
            exit 1
          fi
          echo "✅ Syntaxe PHP + JS valide — déploiement autorisé."

          # ── Cohérence de version des assets (coquille ⇄ service worker) ──
          # La coquille demande /app.js?v=X ; sw.js précharge /app.js?v=ASSET_VER
          # dérivé de CACHE_VERSION. Constaté en production le 04/08/2026 : les
          # deux avaient divergé (1.11.3 vs 1.13.0). Conséquences silencieuses —
          # ~3,7 Mo préchargés pour une URL que personne ne demande, et surtout
          # le mode hors ligne inopérant, la page réclamant une URL absente du
          # cache. Rien ne plante : c'est précisément pour ça qu'on l'automatise.
          # ⚠️ 28/08/2026 — ce contrôle lisait VERITAS_v1.2.html, qui n'est PAS
          # le fichier servi : la production sert app.html. Les deux ont donc
          # dérivé sans un mot — app.html demandait app.js?v=1.19.45 pendant que
          # sw.js était en 1.20.2. Or app.js est servi « immutable » un an : tant
          # que l'URL ne change pas, le navigateur d'un visiteur DÉJÀ VENU ne la
          # redemande jamais. Chaque correction d'app.js depuis la 1.19.45 est
          # restée invisible pour eux, y compris le propriétaire du site.
          # On contrôle désormais app.html, et on refuse un app.js modifié dont
          # la version n'a pas bougé.
          # ⚠️ 28/08/2026 (second passage) — ce contrôle lisait `app.html`, qui
          # n'est PAS suivi par git : sur un runner fraîchement cloné, le
          # fichier n'existe pas, SHELL_VER sort vide, et les deux gardes
          # ci-dessous sautent EN SILENCE depuis leur écriture. Elles n'ont
          # donc jamais rien vérifié. La coquille réellement déployée est
          # VERITAS_v1.2.html (copiée en deploy/app.html plus bas) : c'est elle
          # qu'on lit. Et son absence est désormais une ERREUR, pas un saut
          # discret — une garde qui ne peut pas s'exécuter doit le dire.
          if [ ! -f VERITAS_v1.2.html ]; then
            echo "::error title=Coquille introuvable::VERITAS_v1.2.html est absent : le contrôle de version des assets ne peut pas s'exécuter. Déploiement ANNULÉ plutôt que de partir sans garde."
            exit 1
          fi
          SHELL_VER=$(grep -o 'app\.js?v=[0-9.]*' VERITAS_v1.2.html | head -1 | sed 's/.*v=//')
          SW_VER=$(grep -o "CACHE_VERSION = 'veritas-v[0-9.]*'" sw.js | head -1 | sed "s/.*veritas-v//;s/'//")
          if [ -n "$SHELL_VER" ] && [ -n "$SW_VER" ] && [ "$SHELL_VER" != "$SW_VER" ]; then
            echo "::error title=Versions d'assets divergentes::VERITAS_v1.2.html demande app.js?v=$SHELL_VER mais sw.js précharge la version $SW_VER. Alignez les deux (et bumpez-les à chaque modification d'app.js)."
            exit 1
          fi
          echo "✅ Version d'assets cohérente ($SHELL_VER) — coquille et service worker alignés."

          # Un app.js modifie sans bump de version ne parvient pas aux visiteurs
          # de retour. On compare au dernier commit qui a touche la version.
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx 'app.js'; then
            if ! git diff HEAD~1 HEAD -- VERITAS_v1.2.html | grep -q '?v='; then
              echo "::error title=app.js modifie sans bump de version::app.js a change mais VERITAS_v1.2.html demande toujours ?v=$SHELL_VER. Bumpez la version dans VERITAS_v1.2.html ET sw.js (CACHE_VERSION)."
              exit 1
            fi
          fi

      # ── 💰 Garde-fou d'argent — bloque le déploiement si une surface payante
      # n'ouvre plus rien. Ce test existait déjà, mais dans un workflow SÉPARÉ
      # (test.yml) : rouge, il n'empêchait rien du tout — deploy.yml partait
      # quand même vers la production. Constaté le 19/08/2026 : la suite était
      # rouge (deux surfaces « livret » sans contrôle d'octroi) et le
      # déploiement, lui, restait autorisé. Un garde-fou qui ne garde rien est
      # pire qu'aucun : il rassure.
      # -- Dependances non suivies : le piege qui revient. Un fichier absent de
      # git n'est JAMAIS deploye, et rien ne le signale : le require echoue en
      # fatal chez le visiteur, ou le <script> revient en 404. Le 19/08/2026,
      # deux fois en une heure : api/_auth_lib.php ouvrait _sentinel.php, la
      # coquille et la vitrine chargeaient assets/veritas-shield.js -- ni l'un
      # ni l'autre suivi par git. Tout le backend serait tombe.
      - name: 🧩 Toute dependance referencee est-elle deployable ?
        run: |
          manquants=0
          SUIVIS=$(git ls-files)
          connu() { printf '%s' "$SUIVIS" | grep -qxF "$1"; }
          for f in $(git ls-files 'api/*.php' 'api/campus/*.php'); do
            d=$(dirname "$f")
            for rel in $(grep -ohE "(require|include)(_once)?[ (]*__DIR__ *[.] *'[^']+'" "$f" 2>/dev/null | sed -E "s/.*'([^']+)'.*/\1/"); do
              cible=$(echo "$d$rel" | sed 's#/[.]/#/#g')
              case "$cible" in api/config.php|api/payment_config.php|api/campus/_config.php) continue ;; esac
              if [ ! -f "$cible" ]; then
                echo "::error title=Dependance absente::$f requiert $rel - fichier introuvable."; manquants=1
              elif ! connu "$cible"; then
                echo "::error title=Dependance non suivie::$f requiert $rel - present en local, ABSENT de git : il ne partira pas et l endpoint tombera en erreur fatale."; manquants=1
              fi
            done
          done
          REFS=$(git ls-files '*.html' | xargs grep -ohE '(src|href)="/?(assets|chunks|api)/[^"?#]+' 2>/dev/null | sed -E 's/.*="\/?//' | sort -u)
          for ref in $REFS; do
            if [ ! -f "$ref" ]; then
              echo "::error title=Asset absent::/$ref est reference par une page mais introuvable."; manquants=1
            elif ! connu "$ref"; then
              echo "::error title=Asset non suivi::/$ref est reference par une page, present en local, ABSENT de git : 404 en production."; manquants=1
            fi
          done
          if [ "$manquants" != "0" ]; then
            echo "::error title=Deploiement ANNULE::Des dependances referencees ne partiraient pas avec le deploiement."
            exit 1
          fi
          echo "OK - toutes les dependances referencees sont suivies par git."

      - name: 💰 Chaque surface payante débloque-t-elle vraiment ?
        run: |
          if command -v php >/dev/null 2>&1; then
            php tests/paiements_entitlements.php
          else
            echo "::error title=PHP introuvable::Le garde-fou des surfaces payantes n'a pas pu tourner. Déploiement ANNULÉ."
            exit 1
          fi

      # ── 🎟️ LA PORTE DES CAHIERS — deux règles commerciales, pas du code.
      #    ① un code n'ouvre QUE son manuel   ② et QUE sa version (élève/prof).
      #    Le 25/08/2026, le serveur émettait un code « guide » pour un ouvrage
      #    vendu sans guide : un code encaissé qui n'ouvrait rien. La garde
      #    existait (vrt_livret_ouvrage_accepte) et n'était appelée nulle part.
      #    Ce banc lance un vrai serveur PHP et rejoue le parcours HTTP complet.
      - name: 🎟️ Un code n'ouvre-t-il QUE son manuel et sa version ?
        run: |
          if command -v php >/dev/null 2>&1; then
            node tests/banc_livret_codes.cjs
            node tests/banc_cahier.cjs
          else
            echo "::error title=PHP introuvable::Les bancs de la porte des cahiers n'ont pas pu tourner. Déploiement ANNULÉ."
            exit 1
          fi

      # ── 🔑 LA CLÉ D'UN EXERCICE survit-elle à une correction du cahier ?
      #    Si elle bouge, l'élève retrouve ses réponses sous les mauvaises
      #    questions et l'annotation du professeur désigne un autre exercice.
      #    Rien ne casse : tout glisse, en silence, à la rentrée suivante.
      #    Mesuré le 26/08/2026 : avec un compteur d'affichage (le moteur
      #    d'origine), UN exercice ajoute deplacait les 55 reponses d'un cahier
      #    de 2nde. Pas de PHP ni de navigateur ici : la regle est une fonction
      #    pure, elle s'eprouve en une seconde.
      - name: 🔑 Une reponse reste-t-elle attachee a SA question ?
        run: node tests/banc_cles_cahier.cjs

      # ── 🧭 Le corrigé attend sur le serveur, rangé sous l'EMPREINTE de sa
      #    consigne. Deux programmes calculent cette empreinte — le producteur
      #    en Python, le cahier en JavaScript. Si elles divergent d'un
      #    caractère, aucun corrigé ne se retrouve, et l'élève lit « pas de
      #    correction pour cet exercice » : le message exact d'un exercice qui
      #    n'en a pas. Rien ne distinguerait la panne du cas normal.
      #    Trouvé par ce banc le 27/08 : 58 consignes sur 40 720 divergeaient,
      #    toutes marquées d'un pictogramme — un emoji vaut DEUX unités UTF-16
      #    et un seul point de code, la coupe à 400 ne tombait pas au même
      #    endroit des deux côtés.
      - name: 🧭 Les deux empreintes concordent-elles ?
        run: node tests/banc_empreintes.cjs

      # ── 🔑 LE COMPTE DU SITE OUVRE-T-IL L'ATELIER ? ────────────────────────
      #    L'Atelier promet : « L'inscription se fait sur veritas-school.com,
      #    puis vous revenez ici avec le même identifiant. » Deux programmes
      #    qui ne se parlent pas tiennent cette phrase — app.js fabrique le mot
      #    de passe dans le navigateur, api/plateforme.php le vérifie sur le
      #    serveur — et rien ne signale leur désaccord : l'inscrit saisit le BON
      #    mot de passe et se voit refuser, sans explication.
      #    C'est arrivé : `doRegister()` rangeait le mot de passe EN CLAIR,
      #    que le serveur rejette explicitement. Corrigé le 28/08/2026.
      - name: 🔑 Le mot de passe du site ouvre-t-il l'Atelier ?
        run: node tests/banc_mdp_inter_sites.cjs

      # ── 🪪 LE COMPTE CRÉÉ SUR LE SITE EXISTE-T-IL AILLEURS QUE DANS CE
      #    NAVIGATEUR ? Le banc ci-dessus vérifiait la FORME du mot de passe et
      #    passait au vert pendant tout l'incident du 28/08/2026 : les
      #    empreintes étaient justes, mais dans une base que le serveur ne voit
      #    pas. `doRegister()` écrivait le compte dans localStorage et rien de
      #    plus — `_fbFetch` court-circuite api/db.php pour les non-admins —
      #    tandis que `plateforme.php?action=session` lit la base du SERVEUR.
      #    Résultat : « Identifiants invalides » pour TOUT nouvel inscrit, et
      #    un compte perdu au moindre changement d'appareil. Celui-ci mesure
      #    l'autre moitié du contrat : le compte ARRIVE (api/compte.php) et il
      #    SURVIT à une synchronisation administrateur (api/db.php).
      - name: 🪪 Le compte créé sur le site atteint-il le serveur ?
        run: node tests/banc_compte_serveur.cjs

      # ── 🎓 L'ENSEIGNANT ATTEINT-IL SON ATELIER, ET NE VOIT-IL QUE SES
      #    MATIÈRES ? Deux frictions signalées le 28/08/2026. D'abord un
      #    produit vendu à l'inscription puis introuvable : il fallait quitter
      #    la page, retaper l'adresse de mémoire et ressaisir l'identifiant
      #    qu'on venait de choisir. Le lien le transporte maintenant en
      #    fragment (#u=) — deux programmes sans appel commun tiennent cette
      #    promesse, exactement la configuration qui a produit le bug d'auth
      #    du même jour, donc on mesure les DEUX bouts. Ensuite un professeur
      #    de français devant les épreuves de génie civil : le filtre existait,
      #    rien ne le pré-remplissait. Le contrôle qui compte le plus est
      #    celui de la page vide — une restriction appliquée aveuglément
      #    ferait conclure que le catalogue est vide.
      - name: 🎓 L'enseignant atteint-il son Atelier ?
        run: node tests/banc_atelier_enseignant.cjs

      # ── 🧹 LE NOUVEL INSCRIT TROUVE-T-IL UNE PAGE VIERGE ? L'Atelier est
      #    livré avec un décor — six profils, trois épreuves, deux cours, des
      #    propositions, des messages — qui sert la visite guidée. Mais
      #    `_adopterIdentite` le RE-TAMPONNAIT au nom du compte qui venait de
      #    se connecter : chaque nouvel inscrit ouvrait son espace sur trois
      #    épreuves jamais écrites, « 12 événements » d'activité, dix
      #    notifications, un établissement pré-rempli et « 14 / 20 épreuves ce
      #    mois » hérité du profil `u1`. Règle du projet : base vide ⇒ rien
      #    affiché, on n'invente ni activité ni statistique. Elle avait déjà
      #    été rétablie trois fois par des filtres à l'AFFICHAGE, et un écran
      #    passait chaque fois entre les mailles — d'où la règle à la SOURCE.
      - name: 🧹 Le nouvel inscrit trouve-t-il une page vierge ?
        run: node tests/banc_atelier_demo.cjs

      # ── 📚 LE CORPUS PROPOSÉ CORRESPOND-IL À LA LEÇON ? Le sélecteur de
      #    texte support ne cherchait que dans l'auteur, le titre et le corps
      #    du texte : pour une « Leçon de langue — les expansions du nom, 6ᵉ,
      #    séquence 3 », il proposait les 2 054 fiches dans l'ordre du fichier.
      #    Chaque fiche porte pourtant son niveau, son type, son module et ses
      #    faits de langue. On CLASSE désormais, sans filtrer : masquer
      #    risquerait de cacher le texte cherché, et une liste vide ferait
      #    croire au répertoire vide alors que c'est la leçon qui n'est pas
      #    renseignée. Le banc vérifie aussi qu'une leçon vide ne fabrique
      #    AUCUN conseil — on n'annonce pas une pertinence qu'on n'a pas.
      - name: 📚 Le corpus proposé correspond-il à la leçon ?
        run: node tests/banc_corpus_lecon.cjs

      # ── 🗓️ LE CALENDRIER PEUT-IL AFFICHER QUELQUE CHOSE ? Il lisait
      #    `ep.date` — le champ « Période », dont l'exemple est « Trimestre 1 ».
      #    `_parseDate` n'accepte que AAAA-MM-JJ ou JJ/MM/AAAA : aucune date
      #    n'en sortait jamais, aucun point ne se posait, et « Aucune date
      #    d'épreuve renseignée ce mois-ci » s'affichait quoi que l'enseignant
      #    écrive. Rien ne le signalait — ce message est exactement ce qu'on
      #    attend d'un mois vide. Une période situe dans l'année, une ÉCHÉANCE
      #    dit quand ce doit être prêt : `ep.echeance`, champ de type `date`.
      - name: 🗓️ Le calendrier peut-il afficher quelque chose ?
        run: node tests/banc_calendrier.cjs

      # ── 🗺️ CE QUE LE SITE PUBLIE EST-IL ATTEIGNABLE ? Mesuré le 30/08/2026
      #    sur la page d'accueil RÉELLEMENT SERVIE : le mot « corrigé » y
      #    figure 139 fois, et AUCUN lien ne mène à /corriges/ — ni href, ni
      #    window.open, ni action de navigation. Quatre-vingt-treize pages dont
      #    le site parle sans jamais y conduire. Même silence sur /livrets/,
      #    /evaluations/, /niveaux/, /outils/, /cours/, /parcours/, /flash/,
      #    /adopter/, constellation.html et manuels.html : 165 pages publiées,
      #    invisibles depuis l'accueil. Rien ne le signalait — une page
      #    orpheline répond 200 quand on connaît son adresse.
      - name: 🗺️ Ce que le site publie est-il atteignable ?
        run: node tests/banc_plan_site.cjs

      # ── 🔎 LA RECHERCHE TROUVE-T-ELLE CE QUE LE SITE PUBLIE ? L'index ne
      #    connaissait que les catalogues de l'application et les corrigés :
      #    309 entrées, dont aucune page publique hors corrigés. Chercher
      #    « BEPC blanc » ne rendait RIEN alors que trois épreuves blanches
      #    sont en ligne. Et il était PÉRIMÉ : 55 corrigés indexés pour 89
      #    publiés — trente-quatre pages introuvables, sans le moindre signal.
      #    Un index obsolète ne produit pas d'erreur, il produit du silence.
      #    Le banc vérifie AUSSI qu'aucune page `noindex` n'y a fuité : onze
      #    livrets sont des cahiers payants, servis après paiement.
      - name: 🔎 La recherche trouve-t-elle ce que le site publie ?
        run: node tests/banc_recherche.cjs

      # ── 👤 CHAQUE PROFIL RETROUVE-T-IL SES ACCÈS ? Le plan public range le
      #    site par profil ; il restait le CONNECTÉ, qui n'a aucune raison de
      #    retourner sur la page d'accueil pour retrouver les œuvres au
      #    programme. `_espacePerso` proposait quatre actions à l'enseignant,
      #    au parent, au partenaire — et RIEN à l'élève : sa branche retombait
      #    sur `[]`, alors qu'il est le public principal. Il n'atteignait même
      #    pas cet espace : les cinq appels ne visaient que les trois autres.
      #    Le banc compare AUSSI les deux surfaces (VERITAS_ACCES et
      #    build_plan.py) : sans cela elles divergent, et un service ajouté
      #    d'un côté manque de l'autre.
      - name: 👤 Chaque profil retrouve-t-il ses accès ?
        run: node tests/banc_espaces_profil.cjs

      # ── 💾 LE TRAVAIL DE L'ADMINISTRATEUR SURVIT-IL ? Deux pertes
      #    silencieuses, signalées « l'enregistrement ne tient pas après
      #    rechargement ». (1) Le pull remplaçait la base locale dès que le
      #    serveur se disait plus récent — or le serveur touche lastModified à
      #    chaque inscription de visiteur : il suffisait qu'un élève s'inscrive
      #    pour effacer le manuel que l'admin venait d'ajouter. (2) L'envoi ne
      #    gardait que les empreintes bcrypt : les S256 du navigateur étaient
      #    SUPPRIMÉES, et les comptes montaient au serveur sans mot de passe.
      - name: 💾 Le travail de l'administrateur survit-il ?
        run: node tests/banc_synchro_admin.cjs

      # ── 🖼️ LES COUVERTURES DÉPOSÉES SONT-ELLES UTILISÉES ? Soixante visuels
      #    versionnés et servis en production (HTTP 200), et pourtant l'accueil
      #    affichait la MÊME photo générique de manuels empilés pour « Ngum a
      #    Jemea », « Balafon », « Capitoline » et « Le Tube Digestif ». Quant à
      #    5e-arbre-fetiche, sa page retombait sur l'image de partage du site
      #    parce que sa couverture est le seul .png du dossier.
      #    Rien ne le signale : une image générique s'affiche parfaitement,
      #    elle est juste fausse.
      - name: 🖼️ Les couvertures déposées sont-elles utilisées ?
        run: node tests/banc_couvertures.cjs

      # ── 🛒 UNE SEULE DEVANTURE, UN SEUL FLUX. Le centre vendait à deux
      #    endroits : les manuels par DB.books et la boutique de l'accueil, les
      #    quinze cahiers interactifs par livrets_catalogue.json et une page à
      #    part. Un client cherchant « le cahier de 4ᵉ » devait deviner lequel
      #    des deux rayons regarder. Les deux sortent du même flux désormais.
      #    Le banc exécute RÉELLEMENT l'endpoint : lire le source dirait qu'il
      #    contient du code pour les livrets, pas qu'il en produit. Il vérifie
      #    surtout que la carte suit l'URL du produit — sans quoi un cahier
      #    pointerait `app.html#livre?id=livret:6e`, une fiche inexistante.
      - name: 🛒 Une seule devanture, un seul flux ?
        run: node tests/banc_boutique_unifiee.cjs

      # ── 💳 LE TUNNEL FACTURE-T-IL CE QU'ON A CLIQUÉ ? Signalé par Jacques le
      #    31/08/2026 devant un « Spécial BAC — Français Terminale » à 5 000 F,
      #    barré 6 500 F, « le plus vendu du catalogue » : « ceci n'existe pas ».
      #    Le bloc n'était branché sur rien. Pire, le tunnel derrière facturait
      #    5 000 F l'unité EN DUR — `montantTotal()` ignorait le produit — et
      #    envoyait au prestataire une ligne nommée « Cahier VÉRITAS ». Un
      #    cahier à 1 500 F était donc encaissé 5 000 F sous un nom que le
      #    centre n'aurait rattaché à aucune commande.
      #    Le banc EXÉCUTE les fonctions du tunnel avec plusieurs articles :
      #    lire le fichier dirait qu'il contient « prixUnitaire », pas qu'il
      #    calcule juste. Éprouvé par mutation le 31/08 (prix remis en dur :
      #    8 contrôles au rouge ; pastille remise : 2 au rouge).
      - name: 💳 Le tunnel facture-t-il ce qu'on a cliqué ?
        run: node tests/banc_tunnel_article.cjs

      # ── 📱 LA PLANCHE DE TRAVAIL TIENT-ELLE SUR UN TÉLÉPHONE ? Mesuré au
      #    navigateur sur 375 px le 28/08/2026 : 842 px défilaient AVANT la
      #    première ligne du texte — un écran entier rien que pour y arriver.
      #    La rangée « Structure officielle » ne s'était JAMAIS repliée (son
      #    style s'écrivait `{{ var }};display:flex`, la seconde déclaration
      #    annulant la première), la zone de saisie d'une question faisait
      #    184 px de large pour 36 de haut quand son contenu en demandait 121,
      #    et le texte restait justifié avec césure sur 250 px de colonne.
      #    Après correction : 563 px avant le contenu. Ce banc verrouille les
      #    règles qui produisent ces mesures — un ordre de déclaration réécrit
      #    ou un `!important` retiré, et le gain repart en silence.
      - name: 📱 La planche de travail tient-elle sur un téléphone ?
        run: node tests/banc_atelier_mobile.cjs

      # ── 📚 LA LEÇON TROUVE-T-ELLE SON CORPUS ? Le sélecteur de texte support
      #    ne cherchait que dans l'auteur, le titre et le corps du texte : pour
      #    une « Leçon de langue — les expansions du nom, 6ᵉ », il proposait les
      #    2 054 fiches dans l'ordre du fichier. Chaque fiche porte pourtant son
      #    niveau, son type, son module et ses `faits` de langue. On CLASSE
      #    désormais (on ne filtre pas : masquer, c'est risquer de cacher le
      #    texte cherché), et le contrôle qui compte est celui du SEUIL — sans
      #    lui, 647 fiches sur 1 014 étaient « conseillées », ce qui ne
      #    conseille rien. À 6 points il en reste 156, soit 15 %.
      - name: 📚 La leçon trouve-t-elle son corpus ?
        run: node tests/banc_corpus_lecon.cjs

      # ── 📕 LA BOUTIQUE NE VEND-ELLE QUE CE QUI EXISTE ? ────────────────────
      #    Cinq manuels inventés étaient semés dans defaultDB() avec un PRIX et
      #    un bouton d'achat : « Mathématiques 3ème » chez « MINESEC Éditions »,
      #    etc., content:{} vide. Un visiteur pouvait payer un livre qui n'a
      #    jamais existé — la panne dont on ne se relève pas commercialement,
      #    et que personne au centre n'aurait vue passer. Retirés le 28/08/2026
      #    du seed ET des bases déjà créées, sans toucher à ce qui a été
      #    renommé, pourvu de contenu ou acheté.
      - name: 📕 La boutique ne vend-elle que ce qui existe ?
        run: node tests/banc_faux_livres.cjs

      # ── 💰 Quinze ouvrages en vente depuis le 27/08, contre cinq avant.
      #    `vrt_verifier_prix()` laisse passer N'IMPORTE QUEL montant quand le
      #    tarif de référence est indéterminable — c'est le trou par lequel
      #    100 FCFA ouvraient un abonnement à 5 000 sur l'Atelier. Dix produits
      #    neufs, dix occasions de le rouvrir, et la panne est muette des deux
      #    côtés : l'acheteur est content, le vendeur voit un paiement de plus.
      # ── 🔒 LES VERROUS DES DOSSIERS PAYANTS SONT-ILS ACCEPTABLES ?
      #    Un .htaccess que l'hébergeur refuse n'est pas « à moitié appliqué » :
      #    il est ignoré EN ENTIER et le dossier répond 500. Il paraît alors
      #    protégé — il ne l'est plus que par l'erreur. Le jour où LWS
      #    choisirait d'ignorer un fichier invalide plutôt que d'échouer, tout
      #    le catalogue vendu deviendrait téléchargeable en clair.
      #    Deux directives ont déjà provoqué ce rejet, à neuf jours d'écart :
      #    « RemoveHandler » (19/08) puis un « Require all denied » posé À NU
      #    dans un <FilesMatch> (mesuré le 28/08 — /uploads/protected/**
      #    répondait 500 quand /api/data/ répondait 403).
      #    On refuse donc de déployer un verrou qui ne suit pas le patron
      #    éprouvé en production.
      - name: 🔒 Les verrous des dossiers payants sont-ils du bon patron ?
        run: |
          faute=0
          for f in $(git ls-files 'uploads/protected/**/.htaccess' 'uploads/protected/.htaccess'); do
            [ -f "$f" ] || continue
            if grep -qE '^[[:space:]]*RemoveHandler' "$f"; then
              echo "::error title=Verrou rejete par l'hebergeur::$f contient RemoveHandler (demande AllowOverride FileInfo, refuse par LWS). Le fichier serait rejete EN ENTIER et le dossier ne serait plus protege. Deploiement ANNULE."
              faute=1
            fi
            # « Require » hors de tout <IfModule> : c'est ce qui a fait tomber
            # le dossier a 500. On SUIT l'imbrication plutot que de compter :
            # une premiere version comparait le nombre de Require au nombre de
            # <IfModule>, et laissait donc passer le cas reel — un <FilesMatch>
            # ajoute apres deux <IfModule> equilibrait le compte. Un garde-fou
            # qui ne rougit pas sur la panne qu'il vise ne sert a rien.
            nu=$(awk '
              /^[[:space:]]*<IfModule/    { d++; next }
              /^[[:space:]]*<\/IfModule>/ { if (d>0) d--; next }
              /^[[:space:]]*Require /     { if (d==0) print NR": "$0 }
            ' "$f")
            if [ -n "$nu" ]; then
              echo "::error title=Require pose a nu::$f contient une directive Require hors de tout <IfModule> :"
              echo "$nu"
              echo "::error::Un Require a nu fait rejeter TOUT le fichier chez LWS (500 sur le dossier, donc plus aucune protection). Deploiement ANNULE."
              faute=1
            fi
            if ! grep -qE '^[[:space:]]*Require all denied' "$f"; then
              echo "::error title=Dossier payant non ferme::$f ne contient aucun « Require all denied ». Deploiement ANNULE."
              faute=1
            fi
          done
          [ "$faute" = "0" ] || exit 1
          echo "✅ Verrous des dossiers payants conformes au patron verifie en production."

      - name: 💰 Chaque ouvrage du catalogue a-t-il un prix et une porte ?
        run: |
          if command -v php >/dev/null 2>&1; then
            php tests/ouvrages_en_vente.php
          else
            echo "::error title=PHP introuvable::Le banc des tarifs n'a pas pu tourner. Déploiement ANNULÉ."
            exit 1
          fi

      # ── 🛡️ Le bouclier anti-robots garde MAINTENANT toutes les surfaces
      #    publiques, y compris les payantes. Une régression y est invisible
      #    dans les deux sens : soit les portes s'ouvrent, soit les élèves
      #    restent dehors — et personne ne s'en aperçoit avant les plaintes.
      - name: 🛡️ Le bouclier tient-il (robots, IA, débit, laissez-passer) ?
        run: |
          if command -v php >/dev/null 2>&1; then
            php tests/sentinelle.php
          else
            echo "::error title=PHP introuvable::Le garde-fou anti-robots n'a pas pu tourner. Déploiement ANNULÉ."
            exit 1
          fi

      # ── 🚪 Espaces par rôle — une entrée de menu sans route ne lève aucune
      # exception : render() sert le tableau de bord sous le titre demandé.
      - name: 🚪 Espaces par rôle (entrées mortes, chiffres inventés)
        run: node tests/espaces_roles.cjs

      # ── 📐 ATELIER DE FRANÇAIS — cinq garde-fous, aucun ne tournait ici.
      #    Jusqu'au 26/08/2026 la CI ne touchait pas l'Atelier : ces sondes
      #    ne protégeaient que le poste de celui qui pensait à les lancer.
      #    C'est le défaut « garde écrite, jamais appelée », déjà payé.
      #    Toutes tournent sans navigateur et sans le corpus (gitignoré,
      #    donc absent d'une machine de CI) : elles se rabattent sur un
      #    corpus synthétique, et l'annoncent. Quelques secondes en tout.
      - name: 📐 Atelier — le bloc applicatif compile-t-il ?
        run: node tests/verif_syntaxe_atelier.cjs

      # Une liaison {{ }} sans clé dans renderVals() ne lève RIEN : le bouton
      # est mort, sans erreur ni trace. C'est la panne du formulaire de
      # connexion-décor du 21/08, restée invisible en production.
      - name: 🔗 Atelier — chaque bouton du gabarit trouve-t-il sa fonction ?
        run: node tests/verif_liaisons_atelier.cjs

      # La métadonnée et le contenu descendent séparément. Quand le second
      # transfert échoue, l'export Word annonce 387 mots au-dessus d'un texte
      # de 33 — et l'épreuve part en photocopie.
      - name: 📖 Atelier — le contenu suit-il sa métadonnée ?
        run: node tests/sonde_corpus_sync.cjs

      # _persist() est appelé à chaque frappe. Sans le différé, un envoi par
      # appel : LWS bannit l'IP à six mauvaises requêtes par minute, et une
      # file trop bavarde a déjà fermé le site entier.
      - name: 📡 Atelier — la synchro reste-t-elle économe en requêtes ?
        run: node tests/sonde_sync_groupe.cjs

      # Une équipe naissait avec la liste de membres du NAVIGATEUR (des
      # profils de démonstration) : le premier envoi passait, tous les
      # suivants tombaient en 403 — pour le créateur du groupe lui-même.
      - name: 👥 Atelier — le travail d'équipe franchit-il le navigateur ?
        run: node tests/sonde_collaboratif.cjs

      # Une recommandation fabriquee coute plus cher que pas de
      # recommandation : proposer « les textes que vous aimez » a qui n a rien
      # ouvert apprend au lecteur que le reste ment peut-etre aussi. Ce
      # controle defend la regle « base vide = rien affiche », et verifie que
      # les astuces citent le REFERENTIEL au lieu d etre inventees.
      - name: 💡 Atelier — les suggestions sont-elles fondées sur du réel ?
        run: node tests/sonde_gouts_atelier.cjs

      # Les cartes d'abonnement portaient leurs prix et leurs quotas
      # ECRITS EN DUR. L'administration reglait un plafond, le serveur
      # l'appliquait, et la carte annoncait toujours l'ancien chiffre :
      # l'enseignant lisait 30 exports et se voyait refuser le sixieme.
      # Le serveur peut renommer une cle sans qu'aucune erreur ne se
      # leve -- le client lit undefined et retombe sur ses valeurs en
      # dur. Ce controle est le seul qui attrape cette divergence.
      - name: 💰 Atelier — annonce-t-on le tarif qu'on exige ?
        run: node tests/sonde_tarifs_atelier.cjs

      - name: 📋 Préparer les fichiers
        run: |
          mkdir -p deploy/api \
                   deploy/data \
                   deploy/api/data \
                   deploy/uploads/veritas \
                   deploy/uploads/media \
                   deploy/uploads/video \
                   deploy/uploads/epreuve \
                   deploy/uploads/cours \
                   deploy/uploads/ressource \
                   deploy/uploads/image \
                   deploy/uploads/protected/enseignant \
                   deploy/uploads/protected/livrets

          # ── Verrous des dossiers protégés ───────────────────────
          # Les .htaccess « Require all denied » DOIVENT accompagner les dossiers
          # protégés : sans eux, un Guide déposé par FTP serait téléchargeable par
          # son URL, et la porte api/teacher_access.php ne servirait à rien.
          for d in uploads/protected uploads/protected/enseignant uploads/protected/livrets; do
            if [ -f "$d/.htaccess" ]; then
              cp "$d/.htaccess" "deploy/$d/.htaccess"
              echo "  ✓ $d/.htaccess (accès HTTP direct interdit)"
            else
              echo "::warning title=Dossier protégé sans verrou::$d/.htaccess manquant"
            fi
          done
          [ -f uploads/protected/enseignant/LISEZMOI.txt ] && cp uploads/protected/enseignant/LISEZMOI.txt deploy/uploads/protected/enseignant/
          [ -f uploads/protected/livrets/LISEZMOI.txt ] && cp uploads/protected/livrets/LISEZMOI.txt deploy/uploads/protected/livrets/

          # ── Application principale ──────────────────────────────
          # app.html → servi par index.php (wrapper no-cache LiteSpeed)
          # index.html → accès direct sans PHP
          # Priorité v1.2 si présent, sinon fallback v1.1
          if [ -f "VERITAS_v1.2.html" ]; then
            cp VERITAS_v1.2.html deploy/app.html
            echo "  ✓ VERITAS_v1.2.html → app.html"
          else
            cp VERITAS_v1.1.html deploy/app.html
            echo "  ✓ VERITAS_v1.1.html → app.html"
          fi

          # ── Vitrine publique (refonte août 2026) ────────────────────────
          # « / » sert désormais la vitrine (via index.php), et non plus la
          # coquille applicative. index.html en reçoit une copie pour l'accès
          # direct sans PHP. L'application reste sur app.html : ne PAS la
          # remplacer ici, les espaces connectés et les 64 pages statiques y
          # renvoient.  Échec bruyant : un index.html contenant l'application
          # alors qu'index.php sert la vitrine donnerait deux accueils
          # différents selon l'URL tapée, et le bug serait invisible en CI.
          if [ -f vitrine.html ]; then
            cp vitrine.html deploy/vitrine.html
            cp vitrine.html deploy/index.html
            echo "  ✓ vitrine.html → vitrine.html + index.html (accueil public)"
          else
            echo "::error title=Vitrine manquante::vitrine.html est absent du dépôt alors qu'index.php la sert en racine. Le site s'ouvrirait sur l'application. Déploiement ANNULÉ."
            exit 1
          fi
          cp index.php         deploy/index.php
          # v1.2.2 : CSS + JS principaux extraits (cacheables séparément → 1er chargement allégé)
          if [ -f app.css ]; then cp app.css deploy/; echo "  ✓ app.css"; fi
          if [ -f app.js ];  then cp app.js  deploy/; echo "  ✓ app.js"; fi

          # Logo
          if [ -f "Logo détouré.png" ]; then cp "Logo détouré.png" deploy/; fi

          # ── Bannière de partage (og:image) ──────────────────────
          # <meta property="og:image"> pointait vers og-image.jpg… qui n'était
          # PAS déployé (404). Résultat : aucun aperçu lors d'un partage
          # WhatsApp/Facebook — sur un site dont l'acquisition passe par le
          # partage. Ne pas retirer.
          if [ -f og-image.jpg ]; then cp og-image.jpg deploy/; echo "  ✓ og-image.jpg (aperçu de partage)"; fi

          # Avatar IA Ambassa (portrait — .png ou .jpg selon disponibilité)
          if [ -f "ambassa-avatar.png" ]; then cp "ambassa-avatar.png" deploy/; echo "  ✓ ambassa-avatar.png"; fi
          if [ -f "ambassa-avatar.jpg" ]; then cp "ambassa-avatar.jpg" deploy/; echo "  ✓ ambassa-avatar.jpg"; fi

          # .htaccess (sécurité + cache + MIME)
          if [ -f .htaccess ]; then cp .htaccess deploy/; fi

          # ── Catalogue des livres numériques (fiches SEULEMENT) ───
          # Aucun contenu ici : titres, prix, nombre de pages. Le livre
          # lui-même reste dans uploads/protected/, déposé par FTP, hors
          # du dépôt (GitHub est public).
          # Signalé HAUT ET FORT s'il manque : un « [ -f ] && cp » muet a
          # déjà coûté des heures ici, et sans ce fichier les livres vendus
          # disparaissent de la boutique sans qu'aucune erreur ne le dise.
          if [ -f catalogue_livres.json ]; then
            cp catalogue_livres.json deploy/ && echo "  ✓ catalogue_livres.json"
          else
            echo "::warning title=Catalogue des livres absent::catalogue_livres.json introuvable — aucun livre numérique ne sera proposé."
          fi

          # ── SEO + PWA (sitemap, robots, manifest) ───────────────
          for f in sitemap.xml sitemap-index.xml robots.txt manifest.webmanifest sw.js ai.txt; do
            [ -f "$f" ] && cp "$f" deploy/ && echo "  ✓ $f"
          done

          # ── v1.9 (#7) Pages SEO statiques des épreuves gratuites ──
          # NON-BLOQUANT : un échec n'interrompt JAMAIS le déploiement.
          if node tools/build_seo.cjs --base https://veritas-school.com; then
            [ -d seo ] && cp -r seo deploy/ && echo "  ✓ seo/ ($(ls seo | wc -l) fichiers)"
          else
            echo "  ⚠ build_seo ignoré (non bloquant)"
          fi

          # ── Pages SEO des ŒUVRES au programme (analyses/fiches par œuvre) ──
          if [ -d oeuvres ]; then cp -r oeuvres deploy/ && echo "  ✓ oeuvres/ ($(ls oeuvres | wc -l) fichiers)"; fi
          if [ -d ressources ]; then cp -r ressources deploy/ && echo "  ✓ ressources/ ($(ls ressources | wc -l) fichiers)"; fi
          if [ -d decouvrir ]; then cp -r decouvrir deploy/ && echo "  ✓ decouvrir/ ($(ls decouvrir | wc -l) fichiers)"; fi
          if [ -d niveaux ]; then cp -r niveaux deploy/ && echo "  ✓ niveaux/ ($(ls niveaux | wc -l) fichiers)"; fi
          # ── Outils gratuits (calculateurs autonomes = aimants SEO) ──
          # _style.txt est une note de travail : elle reste hors du déploiement.
          if [ -d outils ]; then
            cp -r outils deploy/ && rm -f deploy/outils/_style.txt
            echo "  ✓ outils/ ($(ls outils/*.html outils/*.xml 2>/dev/null | wc -l) fichiers publics)"
          fi

          # ── Corrigés des manuels (cible des astuces 🌐 imprimées) ──
          # corriges/ = hub + 1 dossier par niveau (6e…tle) + pages EST.
          # Généré par tools/build_corriges.py depuis les Guides pédagogiques
          # et les sources des packs ; les .html sont commités tels quels.
          if [ -d corriges ]; then
            cp -r corriges deploy/
            echo "  ✓ corriges/ ($(find corriges -name '*.html' | wc -l) pages)"
          fi

          # -- livrets/ = livrets interactifs SOUS VERROU SERVEUR --------
          # Coquilles SEULES : les donnees (booklet-*.js / guide-*.js) ne
          # sont pas ici et ne doivent JAMAIS l'etre — le depot GitHub est
          # public. Elles vivent dans uploads/protected/livrets/, deposees
          # par FTP, et ne sortent que par api/livret.php apres code valide.
          if [ -d livrets ]; then
            for f in livrets/*.html; do
              [ -f "$f" ] || continue
              case "$f" in livrets/demo-*|livrets/mode-emploi*|livrets/feuilletage-*|livrets/index*) continue ;; esac
              if grep -qE "VERITAS2026|PROF2026" "$f"; then
                echo "::error title=Livret non verrouille::$f contient encore un code en dur. Reconstruire avec tools/prepare_livrets.py. Deploiement ANNULE."
                exit 1
              fi
              if grep -qE 'window[.](BOOKLET|GUIDE)[A-Z0-9_]* *=' "$f"; then
                echo "::error title=Contenu dans la coquille::$f embarque les donnees du livret — le produit partirait en clair. Deploiement ANNULE."
                exit 1
              fi
            done
            # Les extraits GRATUITS (demo-*.js) sont les seules donnees
            # publiables. Un fichier complet fait ~450 Ko : au-dela de
            # 120 Ko, c'est le produit qui part en clair.
            for f in livrets/*.js; do
              case "$(basename "$f")" in support.js|gate.js) continue ;; esac
              t=$(wc -c < "$f")
              if [ "$t" -gt 122880 ]; then
                echo "::error title=Donnees completes dans livrets/::$f pese $((t/1024)) Ko — seuls les extraits gratuits (<120 Ko) sont publiables. Deploiement ANNULE."
                exit 1
              fi
            done

            # -- Les APERCUS gratuits (extrait-*.js) ---------------------
            # Ce sont les seuls fichiers de contenu que le depot public
            # heberge, et ils partent sur le site sans aucun code. Deux
            # regles arretees par Jacques le 27/08/2026, verifiees ICI parce
            # qu'un producteur peut etre relance avec de mauvaises options,
            # et que le depot, lui, garde ce qu'on y pousse :
            #   (1) aucun corrige — un apercu qui donne les reponses vend le
            #       cahier a personne ;
            #   (2) DEUX lecons au plus — au-dela, ce n'est plus un apercu,
            #       c'est une partie du produit qu'on offre.
            for f in livrets/extrait-*.js; do
              [ -f "$f" ] || continue
              if grep -qE '"y":"corrige"|"answer"|Corrige [-]{2}|Corrig.{1,2} —' "$f"; then
                echo "::error title=Corrige dans un apercu gratuit::$f contient une correction. Regenerer avec: python tools/normaliser_cahiers.py --charge <dossier>. Deploiement ANNULE."
                exit 1
              fi
              n=$(grep -o '"y":"lecon"' "$f" | wc -l)
              if [ "$n" -gt 2 ]; then
                echo "::error title=Apercu trop long::$f contient $n lecons (2 au plus). Deploiement ANNULE."
                exit 1
              fi
            done

            cp -r livrets deploy/
            echo "  OK livrets/ ($(find livrets -name '*.html' | wc -l) pages, verrou verifie,"
            echo "     $(ls livrets/extrait-*.js 2>/dev/null | wc -l) apercus gratuits sans corrige)"
          fi

          # -- d/ = pages de devoir partageables (le lien viral) -----------
          # Coquille seule : le devoir arrive d'api/collab.php, et un visiteur
          # sans code n'obtient que l'apercu (exercices du professeur + mur).
          if [ -d d ]; then
            cp -r d deploy/
            echo "  OK d/ (page de devoir partageable)"
          fi

          # ── Constellation VÉRITAS : écosystème autour du cahier papier ──
          # assets/ = feuille de style + JS COMMUNS à toutes les pages statiques
          # (corriges/, eleve/, enseignant/, flash/, constellation.html).
          # ⚠️ Sans assets/, toutes ces pages s'affichent sans style.
          if [ -d assets ]; then
            cp -r assets deploy/
            echo "  ✓ assets/ ($(ls assets | wc -l) fichiers communs)"
          fi

          # ── Modules chargés à la demande (v1.14) ────────────────────────
          # chunks/ = catalogues sortis d'app.js pour alléger le démarrage.
          # ⚠️ Sans ce dossier sur le serveur, les ressources pédagogiques et
          # les analyses littéraires ne s'ouvrent plus : _lazyChunk() échoue.
          if [ -d chunks ]; then
            cp -r chunks deploy/
            echo "  ✓ chunks/ ($(ls chunks/*.js 2>/dev/null | wc -l) modules différés)"
          fi
          # ── Pages légales (mentions, CGV, charte pédagogique) ──────────
          # ⚠️ ÉCHEC BRUYANT. Le pied de page de la vitrine et l'écran
          # enseignants pointent vers ces trois pages ; build_vitrine.js refuse
          # même de construire si elles manquent du dépôt. Les oublier ici
          # donnerait des CGV en 404 sur un site qui encaisse — la pire des
          # combinaisons : le lien promet, le serveur nie.
          # _gabarit.txt est une note de travail : elle reste hors ligne.
          if [ -d legal ]; then
            mkdir -p deploy/legal
            for f in legal/*.html; do
              [ -f "$f" ] || continue
              cp "$f" deploy/legal/
            done
            # Le plancher est passé de 3 à 4 le 27/08/2026 : le site collecte
            # nom, WhatsApp et classe dès la 6ᵉ et n'avait AUCUNE politique de
            # confidentialité (les deux URL attendues rendaient 404). La page
            # existe désormais, le pied de page de la vitrine et celui de
            # l'Atelier y renvoient — l'oublier ici rejouerait exactement le
            # défaut qu'on vient de corriger.
            n=$(ls deploy/legal/*.html 2>/dev/null | wc -l)
            if [ "$n" -lt 4 ]; then
              echo "::error title=Pages légales incomplètes::$n page(s) dans legal/ au lieu de 4 (mentions, CGV, charte, confidentialité). Déploiement ANNULÉ."
              exit 1
            fi
            # Chaque page CITÉE par un pied de page doit être présente, nommément :
            # un compte de 4 ne dit pas LESQUELLES sont là.
            for p in mentions-legales cgv charte-pedagogique confidentialite; do
              if [ ! -f "deploy/legal/$p.html" ]; then
                echo "::error title=Page légale manquante::legal/$p.html est absente alors que le site y renvoie. Déploiement ANNULÉ."
                exit 1
              fi
            done
            echo "  ✓ legal/ ($n pages : mentions, CGV, charte, confidentialité)"
          else
            echo "::error title=Pages légales absentes::legal/ est introuvable alors que la vitrine y renvoie. Déploiement ANNULÉ."
            exit 1
          fi

          if [ -f constellation.html ]; then cp constellation.html deploy/; echo "  ✓ constellation.html"; fi
          # ── PLAN DU SITE PAR PROFIL (généré par tools/build_plan.py) ──────
          #    Mesuré sur la page d'accueil SERVIE le 30/08/2026 : le mot
          #    « corrigé » y figure 139 fois et AUCUN lien ne mène à
          #    /corriges/. Idem pour les livrets, niveaux, outils, cours,
          #    évaluations, parcours, la constellation et les manuels : 165
          #    pages publiées, invisibles depuis l'accueil.
          #    ÉCHEC BRUYANT et non `[ -f ] &&` : ce fichier est désormais le
          #    seul chemin public vers ces pages. S'il manque, on ne déploie
          #    pas un site qui parle de ses corrigés sans y conduire.
          if [ ! -f plan.html ]; then
            echo "::error title=Plan du site manquant::plan.html est absent. C'est le seul chemin public vers /corriges/, /livrets/, /niveaux/, /outils/, /cours/ et /evaluations/. Régénérez-le avec 'python tools/build_plan.py'. Déploiement ANNULÉ."
            exit 1
          fi
          cp plan.html deploy/ && echo "  ✓ plan.html (plan par profil)"
          for d in eleve enseignant flash parcours adopter; do
            if [ -d "$d" ]; then cp -r "$d" deploy/; echo "  ✓ $d/"; fi
          done

          # ── VÉRITAS Campus (SaaS multi-établissement) ───────────
          # Front : campus/*.html + campus.js + config.js.
          # ⚠️ config.js porte le MODE d'hébergement ; il part tel quel, c'est
          #    le fichier que l'on édite pour une install mono-établissement.
          #    Les .md (offre, déploiement) restent internes : pas en ligne.
          if [ -d campus ]; then
            mkdir -p deploy/campus
            for f in campus/*.html campus/*.js campus/*.css; do
              [ -f "$f" ] && cp "$f" deploy/campus/
            done
            echo "  ✓ campus/ ($(ls deploy/campus | wc -l) fichiers publics, docs internes exclues)"
          fi

          # ── Vidéo promotionnelle ───────────────────────────────
          if [ -f VERITAS_Promo_Video.html ]; then
            cp VERITAS_Promo_Video.html deploy/
            echo "  ✓ VERITAS_Promo_Video.html"
          fi

          # ── Pages d'erreur dédiées (cibles de ErrorDocument) ────
          # Sans elles, .htaccess pointerait vers un fichier absent et Apache
          # retomberait sur sa page par défaut.
          # ⚠️ ÉCHEC BRUYANT, et non « if [ -f ] » silencieux : .htaccess
          # NOMME ces deux fichiers. Une garde qui saute sans rien dire
          # laisserait ErrorDocument désigner le vide — et c'est précisément la
          # forme de panne qu'on ne voit jamais en déployant.
          for e in 403 404; do
            if [ ! -f "$e.html" ]; then
              echo "::error title=Page d'erreur manquante::$e.html est absente alors que .htaccess la désigne (ErrorDocument $e). Déploiement ANNULÉ."
              exit 1
            fi
            cp "$e.html" deploy/; echo "  ✓ $e.html"
          done

          # ── Page des corrigés des manuels (manuels.html) ────────
          # ⚠️ Les QR codes IMPRIMÉS dans les manuels 1er cycle pointent ici.
          # Le fichier n'était pas déployé → chaque élève scannant son manuel
          # tombait sur une 404. Ne pas retirer de cette liste.
          if [ -f manuels.html ]; then
            cp manuels.html deploy/
            echo "  ✓ manuels.html (cible des QR imprimés)"
          fi

          # ── Page de réparation d'urgence (reset.html) ──────────
          # Accessible via https://veritas-school.com/reset.html
          # Désinscrit le SW + vide le cache en 1 clic (pour debug user)
          if [ -f reset.html ]; then
            cp reset.html deploy/
            echo "  ✓ reset.html"
          fi

          # ── API PHP ─────────────────────────────────────────────
          # config.php = credentials MySQL → NE JAMAIS déployer via CI
          # payment_config.php = credentials Orange/MTN → NE JAMAIS déployer via CI
          # database_mysql.sql = schéma de référence → NE PAS exposer publiquement
          for f in \
            api/db.php \
            api/upload.php \
            api/config_sync.php \
            api/sync.php \
            api/files.php \
            api/upload_file.php \
            api/upload_video.php \
            api/news_proxy.php \
            api/public_data.php \
            api/payment_orange.php \
            api/payment_mtn.php \
            api/payment_campay.php \
            api/payment_camerpay.php \
            api/_pay_funds_lib.php \
            api/ia_proxy.php \
            api/rag.php \
            api/_oeuvres_auteurs.php \
            api/student_data.php \
            api/_json_boot.php \
            api/_auth_lib.php \
            api/_livret_lib.php \
            api/livret.php \
            api/collab.php \
            api/cahier.php \
            api/content.php \
            api/migrate_protected.php \
            api/db_sql.php \
            api/admin_validate.php \
            api/stats.php \
            api/teacher_access.php \
            api/secure_pdf.php \
            api/secure_epub.php \
            api/_bot_log.php \
            api/_sentinel.php \
            api/challenge.php \
            api/demandes.php \
            api/plateforme.php \
            api/compte.php; do
            # ⚠️ ÉCHEC BRUYANT, et pas un « [ -f ] && cp » silencieux.
            #    Quatre incidents ont la même cause : un endpoint écrit, ajouté
            #    à cette liste, mais jamais « git add » — la CI ne le voit donc
            #    pas, la garde saute sans un mot, et la fonctionnalité est
            #    déclarée livrée alors que le fichier n'existe pas en ligne
            #    (404 masqués par le cache LiteSpeed). Un chemin listé ici est
            #    une PROMESSE : s'il manque, le déploiement s'arrête.
            if [ ! -f "$f" ]; then
              echo "::error title=Endpoint manquant::$f est listé pour le déploiement mais absent du dépôt (oubli de 'git add' ?). Déploiement ANNULÉ — sinon l'API partirait incomplète et les 404 seraient invisibles."
              exit 1
            fi
            cp "$f" deploy/api/ && echo "  ✓ $f"
          done

          # ── Backend VÉRITAS Campus (api/campus/) ────────────────
          # TOUT le dossier part : index.php est le front controller, mais il
          # require les _*.php — en oublier un donne un 500 muet en production.
          # Le .htaccess est OBLIGATOIRE : c'est lui qui interdit l'accès direct
          # aux _*.php et à schema.sql. Sans lui, le déploiement échoue ici
          # plutôt que d'exposer le schéma de la base.
          if [ -d api/campus ]; then
            if [ ! -f api/campus/.htaccess ]; then
              echo "::error title=Campus sans verrou::api/campus/.htaccess manquant — les _*.php et schema.sql seraient lisibles en ligne. Déploiement ANNULÉ."
              exit 1
            fi
            mkdir -p deploy/api/campus
            # _config.php porte les identifiants MySQL et le jeton
            # d'installation : il est gitignoré (dépôt public) et vit
            # uniquement sur le serveur. La CI ne l'a donc pas — et ne doit
            # surtout pas l'écraser avec un fichier vide.
            for f in api/campus/*.php; do
              case "$(basename "$f")" in
                _config.php) echo "  ↷ _config.php ignoré (secrets, reste sur le serveur)" ;;
                *) cp "$f" deploy/api/campus/ ;;
              esac
            done
            cp api/campus/schema.sql deploy/api/campus/
            cp api/campus/.htaccess deploy/api/campus/
            echo "  ✓ api/campus/ ($(ls deploy/api/campus/*.php | wc -l) fichiers PHP + schema.sql + verrou)"
          fi

          # ── Atelier de Francais (plateforme/) ────────────────────
          # Page autonome + ses modules. _corpus_source.js n'est PAS deploye :
          # c'est le corpus en clair, remplace en ligne par api/plateforme.php.
          # Le deployer reviendrait a rendre la marchandise telechargeable.
          mkdir -p deploy/plateforme
          for f in plateforme/*.html plateforme/*.js; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              _corpus_source.js) echo "  - _corpus_source.js ignore (corpus en clair, servi par l API)" ;;
              *) cp "$f" deploy/plateforme/ ;;
            esac
          done
          # ECHEC BRUYANT sur les modules attendus. Un « [ -f ] || continue »
          # seul suffirait a deployer une page amputee : index.html sans
          # minesec.js, c'est un ecran blanc, et le job serait vert.
          # Quatre incidents passes ont cette meme cause (fichier ecrit,
          # jamais « git add » — la CI ne le voit pas au checkout).
          for m in index.html support.js minesec.js conformite.js exercices.js texte.js docx.js; do
            if [ ! -f "deploy/plateforme/$m" ]; then
              echo "::error title=Module manquant::plateforme/$m absent du checkout (oubli de git add ?) — deploiement interrompu."
              exit 1
            fi
          done
          # Le jeton ?v= doit suivre le CONTENU : servis immutable 1 an, un
          # module corrige sous l ancien jeton n atteint jamais un visiteur de
          # retour. On compare le sha1 du fichier a celui inscrit dans le HTML.
          # FINS DE LIGNE NORMALISEES (tr -d '\r') des deux cotes : une copie de
          # travail Windows est en CRLF, ce checkout est en LF, et le meme
          # fichier donnait alors deux empreintes. Le 21/08/2026 cette garde a
          # refuse un deploiement pour cet ecart-la, alors que les six modules
          # etaient rigoureusement identiques. git stocke du LF et le serveur
          # sert du LF : c'est le LF qui fait foi, ici comme dans le versionneur.
          for m in support minesec conformite exercices texte docx; do
            reel=$(tr -d '\r' < "deploy/plateforme/$m.js" | sha1sum | cut -c1-8)
            html=$(grep -oE "$m\.js\?v=[0-9a-f]+" deploy/plateforme/index.html | head -1 | sed 's/.*v=//')
            if [ "$reel" != "$html" ]; then
              echo "::error title=Cache-buster perime::$m.js a pour empreinte $reel mais index.html demande ?v=$html — les visiteurs de retour garderaient l ancien module. Relancer le versionneur."
              exit 1
            fi
          done
          echo "  OK plateforme/ ($(ls deploy/plateforme/ | wc -l) fichiers, jetons ?v= coherents)"

          # ── Page admin de validation des réponses IA (Plan Élite) ─
          if [ -f admin-validation.html ]; then
            cp admin-validation.html deploy/
            echo "  ✓ admin-validation.html"
          fi

          # ── Répertoire data protégé (veritas_db.json) ──────────
          if [ -f api/data/index.php ]; then
            cp api/data/index.php deploy/api/data/
          fi
          # ── SÉCURITÉ CamPay : bloquer l'accès HTTP direct à TOUT api/data/ ──
          #    (jeton CamPay, états de paiement/PII sous payments/, backups).
          #    Sans ce .htaccess, /api/data/payments/*.json serait téléchargeable
          #    à des URL prévisibles puisque le dépôt est public.
          if [ -f api/data/.htaccess ]; then
            cp api/data/.htaccess deploy/api/data/
            echo "  ✓ api/data/.htaccess (bloque jeton CamPay + PII paiements)"
          fi

          # Catalogue des ouvrages : c'est LUI qui dit a api/livret.php quels
          # ouvrages existent, leurs natures et leurs tarifs. Sans lui, le
          # serveur retombe sur les cinq classes historiques, et un ouvrage
          # publie ce matin n'existe pas pour la porte.
          # On ne copie QUE ce fichier : api/data/ contient les registres
          # VIVANTS (codes vendus, copies d'eleves, journaux) — ecraser le
          # dossier entier effacerait les ventes.
          # La garde etait SILENCIEUSE : le fichier etant ecarte par la regle
          # `api/data/*` du .gitignore, il n'a jamais ete dans le depot, donc
          # ce `if` a toujours ete faux et personne ne l'a su. Mesure du
          # 26/08/2026 en production : catalogue = les cinq classes de repli,
          # et « bord-6e », publie et tarife, introuvable pour la porte.
          # Le fichier est desormais suivi (negation dans .gitignore) et son
          # absence PARLE.
          if [ -f api/data/livrets_catalogue.json ]; then
            cp api/data/livrets_catalogue.json deploy/api/data/
            N_OUV=$(grep -o '"[a-z0-9_-]*"[[:space:]]*:[[:space:]]*{' api/data/livrets_catalogue.json | wc -l)
            echo "  OK api/data/livrets_catalogue.json ($N_OUV ouvrages en vente)"
          else
            echo "::warning title=Catalogue des ouvrages absent::api/data/livrets_catalogue.json n'est pas dans le depot. Le serveur retombera sur ses cinq classes historiques et tout ouvrage publie depuis (Bord, cahier d'oeuvre, EST) sera INVISIBLE a la vente. Le produire avec: python tools/publier.py"
          fi

          # Corpus MINESEC servi par api/plateforme.php. Meme regle que le
          # catalogue ci-dessus : on copie CES fichiers et pas le dossier.
          # Cas normal : ABSENTS du checkout — ils sont gitignores (api/data/*)
          # parce que les 1040 textes et 137 citations sont la MARCHANDISE et
          # que ce depot est PUBLIC. Ils se televersent une fois en FTP dans
          # api/data/ et survivent aux deploiements suivants
          # (dangerous-clean-slate est a false). On copie quand meme s'ils sont
          # la, et on TRACE bruyamment sinon : un 503 silencieux sur
          # ?action=corpus serait indiscernable d'une panne serveur.
          for c in corpus citations; do
            if [ -f "api/data/${c}_minesec.json" ]; then
              cp "api/data/${c}_minesec.json" deploy/api/data/
              echo "  OK api/data/${c}_minesec.json (servi sous droit)"
            else
              echo "::notice title=${c}_minesec.json hors CI::Non versionne (marchandise). Doit etre televerse en FTP dans api/data/ ; sinon api/plateforme.php repond 503 sur ?action=${c}."
            fi
          done
          # Repertoire LIBRE DE DROITS (1014 textes du domaine public).
          # ⚠️ 28/08/2026 — CE FICHIER EST DESORMAIS VERSIONNE, et son absence
          # est une ERREUR, plus une note discrete. Il etait gitignore
          # (`api/data/*`), donc jamais present sur le runner : la garde
          # `[ -f ]` ci-dessous sautait a CHAQUE deploiement, la note passait
          # inapercue, et personne ne televersait rien. Pendant ce temps la page
          # d'accueil de l'Atelier annoncait « 2 054 textes, dont 1 014 sans
          # abonnement » tandis que `?action=config` repondait
          # `libre: disponible: false`. Une promesse affichee et non tenue,
          # invisible des deux cotes.
          # Decision de Jacques : versionner, en sachant que le depot est PUBLIC
          # et que le fichier porte aussi l'appareil pedagogique. Le corpus
          # MINESEC, lui, reste hors depot : ses auteurs sont vivants.
          if [ ! -f api/data/corpus_libre.json ]; then
            echo "::error title=Repertoire libre manquant::api/data/corpus_libre.json est suivi par git mais absent du checkout. La page annonce 1 014 textes sans abonnement : les servir est une PROMESSE. Deploiement ANNULE plutot que de la rompre en silence."
            exit 1
          fi
          if [ -f api/data/corpus_libre.json ]; then
            cp api/data/corpus_libre.json deploy/api/data/
            N_LIB=$(grep -o '"n"[[:space:]]*:' api/data/corpus_libre.json | wc -l)
            echo "  OK api/data/corpus_libre.json ($N_LIB textes du domaine public, servis a tous)"
          else
            echo "::notice title=corpus_libre.json hors CI::Non versionne (travail editorial). Doit etre televerse en FTP dans api/data/ ; sinon l index ne servira que le repertoire MINESEC."
          fi
          # ── v1.2.1 : protéger le dossier data/ RACINE où db.php écrit veritas_db.json ──
          #    Sans .htaccess ici, /data/veritas_db.json serait téléchargeable directement (toute la base).
          if [ -f data/.htaccess ]; then
            cp data/.htaccess deploy/data/
            echo "  ✓ data/.htaccess (bloque le téléchargement direct de la base)"
          fi
          printf '<?php http_response_code(403); exit;' > deploy/data/index.php

          # ── Évaluations et cours interactifs ────────────────────
          if [ -d evaluations ]; then cp -r evaluations/ deploy/evaluations/; fi
          if [ -d cours ];       then cp -r cours/       deploy/cours/;       fi

          # ── Couvertures des œuvres littéraires (v1.2.2) ─────────
          if [ -d uploads/oeuvres ]; then
            mkdir -p deploy/uploads/oeuvres
            cp uploads/oeuvres/* deploy/uploads/oeuvres/ 2>/dev/null || true
            echo "  ✓ uploads/oeuvres/ ($(ls uploads/oeuvres | wc -l) couvertures)"
          fi

          # Placeholders uploads (vides au départ, gérés par PHP)
          touch deploy/uploads/.gitkeep
          touch deploy/uploads/veritas/.gitkeep

          echo ""
          echo "✅ Fichiers prêts pour déploiement :"
          find deploy -type f | sort

      # ── 🗜️ Minifier app.js déployé (réduit le poids + le parsing au 1er chargement) ──
      # On minifie UNIQUEMENT la copie deploy/ (la source app.js reste lisible).
      # Mode SÛR : whitespace + syntaxe, SANS renommage d'identifiants (sinon les
      # onclick="fonction()" du HTML casseraient). Repli automatique si invalide.
      - name: 🗜️ Minifier app.js (mode sûr, sans renommage)
        run: |
          if [ -f deploy/app.js ]; then
            before=$(wc -c < deploy/app.js)
            if npx --yes esbuild deploy/app.js --minify-whitespace --minify-syntax --legal-comments=none --outfile=deploy/app.min.js 2>/dev/null \
               && node --check deploy/app.min.js && [ -s deploy/app.min.js ]; then
              mv deploy/app.min.js deploy/app.js
              after=$(wc -c < deploy/app.js)
              echo "✅ app.js minifié : ${before} → ${after} octets"
            else
              echo "::warning title=Minification ignorée::Sortie esbuild invalide — app.js original conservé (déploiement sûr)."
              rm -f deploy/app.min.js
            fi
          fi

      - name: 🔗 Aligner les cache-busters de tous les assets
        run: |
          # Les ?v= de /assets/*.css|js étaient maintenus À LA MAIN, page par page,
          # et ils ont dérivé : app.js en 1.17.2 pendant que veritas-ui.js restait
          # en 1.16.0 sur 64 pages, veritas-pages.css en 1.16.1, motion en 1.16.2.
          # Or .htaccess sert ces fichiers en « max-age=31536000, immutable » : un
          # appareil déjà venu gardait donc l'ancienne version PENDANT UN AN, sans
          # autre recours que vider son cache — le symptôme rapporté en août 2026.
          # On réaligne tout sur la version de la coquille, dans deploy/ seulement.
          BASE=$(grep -o 'app\.js?v=[0-9.]*' deploy/app.html | head -1 | sed 's/.*v=//')
          if [ -z "$BASE" ]; then
            echo "::error title=Version d'asset introuvable::Impossible de lire app.js?v= dans deploy/app.html."
            exit 1
          fi
          # Le numéro écrit à la main ne suffit pas : on peut modifier app.js sans
          # le bumper (deux sessions qui travaillent le même jour, un correctif
          # posé après le bump…). L'URL reste alors identique alors que le contenu
          # a changé — et le service worker, qui met les scripts en cache PAR URL,
          # continue de servir l'ancien code. Constaté le 12/08/2026 : app.js
          # remplacé sur le serveur, navigateur toujours sur la version d'avant.
          # On suffixe donc la version d'une empreinte du contenu RÉELLEMENT servi
          # (après minification) : un octet qui change ⇒ une URL neuve, toujours.
          # Suffixe purement NUMÉRIQUE : la coquille lit sa version avec
          # /app\.js\?v=([0-9.]+)/ (window._VRT_ASSET_VER, qui sert aux chunks),
          # un caractère hexadécimal casserait cette lecture en silence.
          # L'empreinte doit couvrir TOUT ce qui est servi « immutable 1 an »,
          # pas seulement app.js/app.css. Constaté le 20/08/2026 : un correctif
          # dans assets/vitrine.js est parti sur le serveur, mais l'empreinte —
          # calculée sur app.js + app.css, restés identiques — n'a pas bougé.
          # L'URL demandée par la page est donc restée /assets/vitrine.js?v=…807605,
          # et .htaccess la sert « immutable » : le serveur détenait la version
          # neuve (90 289 octets) pendant que chaque visiteur recevait l'ancienne
          # (87 250). Rien ne plante, rien ne s'affiche en erreur — le correctif
          # n'existe simplement pour personne. Le glob shell trie, l'empreinte
          # reste donc stable à contenu égal.
          # livrets/ EST DANS LA LISTE, et ce n'est pas un detail : ses fichiers
          # sont servis « immutable, max-age=31536000 » comme les autres, mais
          # ils n'entraient pas dans l'empreinte. Verifie en production le
          # 27/08/2026 sur livrets/cahier.css et cahier.js. Consequence : une
          # correction du moteur du cahier — celui ou l'eleve ECRIT — serait
          # partie sur le serveur sans jamais atteindre un eleve deja venu, et
          # pendant un an. Rien n'aurait plante : le correctif n'aurait
          # simplement existe pour personne.
          # REGLE : tout ce que .htaccess sert en immutable doit entrer ici.
          EMPREINTE=$(cat deploy/app.js deploy/app.css \
                          deploy/assets/*.css deploy/assets/*.js \
                          deploy/livrets/*.css deploy/livrets/*.js \
                          deploy/chunks/*.js 2>/dev/null | sha1sum | tr -dc '0-9' | cut -c1-6)
          [ -z "$EMPREINTE" ] && EMPREINTE=0
          VER="$BASE.$EMPREINTE"
          echo "   Version de base $BASE + empreinte du contenu → $VER"
          # Ancrage STRICT sur « .css?v= » / « .js?v= ». Un remplacement sur le
          # numéro nu a déjà mangé les paramètres d'un arc SVG (symbole lc-shield,
          # bump 1.17.0 → 1.17.1) : ne jamais élargir ce motif.
          # deploy/plateforme/ est EXCLU. L'Atelier ne partage pas la version du
          # site : chacun de ses six modules porte l'empreinte sha1 de son propre
          # contenu, avec son garde-fou dedie. Or ce sed mange le debut d'une
          # empreinte hexadecimale quand elle commence par un chiffre —
          # « ?v=2e38395c » est devenu « ?v=1.19.47.8937 82e38395c » en
          # production le 21/08/2026. Rien ne cassait : les modules repondaient
          # 200, mais les six ne se distinguaient plus les uns des autres, et un
          # module corrige sans bump du site n'aurait invalide aucun cache.
          n=0
          while IFS= read -r f; do
            if grep -qE '\.(css|js)\?v=[0-9.]+' "$f"; then
              sed -i -E "s/\.(css|js)\?v=[0-9.]+/.\1?v=$VER/g" "$f"
              n=$((n+1))
            fi
          done < <(find deploy -type f \( -name '*.html' -o -name '*.php' \) -not -path 'deploy/plateforme/*')

          # Verification APRES coup : l'etape « Preparer les fichiers » a deja
          # controle ces jetons, mais elle passe AVANT ce sed — elle a donc
          # valide un fichier qu'une etape ulterieure a ensuite reecrit, et la
          # production est partie fausse avec un job vert. On revalide ici, sur
          # les octets qui vont reellement etre televerses.
          for m in support minesec conformite exercices texte docx; do
            reel=$(tr -d '\r' < "deploy/plateforme/$m.js" | sha1sum | cut -c1-8)
            html=$(grep -oE "$m\.js\?v=[0-9a-f]+" deploy/plateforme/index.html | head -1 | sed 's/.*v=//')
            if [ "$reel" != "$html" ]; then
              echo "::error title=Jeton de l Atelier altere::deploy/plateforme/index.html demande $m.js?v=$html alors que le fichier a pour empreinte $reel. Une etape du deploiement a reecrit ce jeton apres le controle initial."
              exit 1
            fi
          done
          echo "   Atelier de Francais : six jetons d empreinte intacts (hors version du site)."
          # Le service worker doit suivre : il DÉRIVE ses URLs de préchargement de
          # CACHE_VERSION (ASSET_VER), et purge à l'activation tout cache dont la
          # clé ne commence pas par cette valeur. Le laisser en arrière lui ferait
          # précharger une URL désormais inexistante — et surtout conserver les
          # caches de la version précédente.
          if [ -f deploy/sw.js ]; then
            sed -i -E "s/(const CACHE_VERSION = 'veritas-v)[0-9.]+(')/\1$VER\2/" deploy/sw.js
            SWV=$(grep -o "veritas-v[0-9.]*" deploy/sw.js | head -1 | sed 's/veritas-v//')
            if [ "$SWV" != "$VER" ]; then
              echo "::error title=Service worker non aligné::CACHE_VERSION vaut '$SWV' au lieu de '$VER' — le cache client ne serait pas purgé."
              exit 1
            fi
            echo "   Service worker aligné : veritas-v$VER"
          fi
          echo "✅ Cache-busters alignés sur $VER dans $n fichier(s)."
          # ── Le trou de la passoire : un asset SANS ?v= du tout ────────────
          # Le remplacement ci-dessus n'attrape que les URLs qui portent déjà
          # « ?v= ». Une feuille appelée « /assets/veritas-pages.css » toute
          # nue traverse donc l'étape sans être touchée… et .htaccess la sert
          # en « immutable, max-age=1 an ». Constaté le 14/08/2026 : les 56
          # pages de corrigés étaient dans ce cas, la charte unifiée ne les
          # atteignait pas. Aucun symptôme visible : la page s'affiche, avec
          # l'ancienne feuille. On refuse désormais de déployer ça.
          nus=$(grep -rhoE '(src|href)="/assets/[A-Za-z0-9_.-]+\.(css|js)"' deploy \
                  --include='*.html' --include='*.php' | sort -u | tr '\n' ' ')
          if [ -n "$nus" ]; then
            echo "::error title=Asset sans cache-buster::$nus — servis « immutable 1 an », donc figés chez tout visiteur déjà venu. Ajoutez ?v= dans le générateur ou la page. Déploiement ANNULÉ."
            exit 1
          fi
          echo "   Aucun asset servi sans ?v= — rien ne restera figé un an."
          # plateforme/ exclu ici aussi : ses jetons sont des empreintes de
          # contenu, pas la version du site. Les compter comme « residuels »
          # ferait crier l'etape a chaque deploiement, et une alerte qui crie
          # toujours ne se lit plus.
          reste=$(grep -rhoE '\.(css|js)\?v=[0-9.]+' deploy --include='*.html' --include='*.php' --exclude-dir=plateforme | grep -v "v=$VER" | sort -u | tr '\n' ' ')
          if [ -n "$reste" ]; then
            echo "::warning title=Versions résiduelles::$reste"
          else
            echo "   Aucune version résiduelle — tous les assets partagent $VER."
          fi

      # ═══════════════════════════════════════════════════════════════════════
      # UN DÉPLOIEMENT PEUT EFFACER LE SITE. LE 30/08, IL L'A FAIT.
      #
      # `dangerous-clean-slate` est à false, mais l'action FTP retire quand
      # même du serveur tout fichier qu'elle y avait déposé et qui a disparu
      # du dossier `deploy/`. C'est voulu : une page retirée du dépôt doit
      # quitter la production.
      #
      # Le piège, c'est la RÉFÉRENCE. Un `gh workflow run deploy.yml` sans
      # `--ref` part sur la branche par défaut. Ce jour-là elle avait cinquante
      # commits de retard : le dossier `deploy/` construit à partir d'elle ne
      # contenait ni l'inscription (`api/compte.php`), ni le lecteur des
      # cahiers PAYÉS (`livrets/cahier.html`), ni le plan du site. L'action a
      # donc fait exactement son travail — elle les a effacés de la production.
      #
      # Aucune garde écrite dans CE fichier n'aurait pu l'empêcher : une
      # référence périmée emporte AUSSI son workflow périmé, donc ses gardes
      # périmées. La seule autorité qu'une référence ne peut pas périmer, c'est
      # la production elle-même. On l'interroge donc directement : si le site
      # sert aujourd'hui une page que ce build n'a pas, ce build l'effacerait.
      #
      # 404 = absent. 000 ou 5xx = on ne sait pas, on le dit sans bloquer.
      # Tout le reste (200, 403 d'un dossier protégé, 405 d'un endpoint en
      # POST) = servi, donc à ne pas perdre.
      # ═══════════════════════════════════════════════════════════════════════
      - name: 🛑 Ce déploiement effacerait-il des pages servies ?
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          # Un témoin par famille ajoutée au fil des mois — c'est-à-dire par
          # famille qu'une référence périmée ne connaîtrait pas.
          TEMOINS="index.html app.html plan.html vitrine.html
                   api/compte.php api/livret.php api/public_data.php api/db.php
                   livrets/cahier.html livrets/gate.js
                   plateforme/index.html
                   corriges/index.html oeuvres/index.html ressources/index.html
                   assets/vitrine.js app.js app.css sw.js"
          PERDUS=""; MUETS=0; VUS=0
          for f in $TEMOINS; do
            C=$(curl -s -o /dev/null --max-time 20 --ssl-no-revoke                      -A "$UA" -H 'Accept: text/html' -H 'Accept-Language: fr-FR'                      -w '%{http_code}' "https://veritas-school.com/$f?_ci=$GITHUB_RUN_ID" || echo 000)
            case "$C" in
              404)          continue ;;                       # pas servi : rien à perdre
              000|5*)       MUETS=$((MUETS+1)); continue ;;    # site injoignable : on ne décide pas
            esac
            VUS=$((VUS+1))
            [ -f "deploy/$f" ] || PERDUS="$PERDUS $f ($C)"
          done
          if [ "$VUS" = "0" ]; then
            echo "::warning title=Production injoignable::Aucun témoin n'a pu être lu ($MUETS muets). Le déploiement continue sans ce contrôle."
            exit 0
          fi
          if [ -n "$PERDUS" ]; then
            echo "::error title=Ce déploiement EFFACERAIT des pages en ligne::La production sert ces fichiers, ce build ne les a pas :$PERDUS"
            echo ""
            echo "  Vous déployez très probablement une référence périmée."
            echo "  Relancez en la nommant :  gh workflow run deploy.yml --ref <votre-branche>"
            echo "  Si ces pages doivent vraiment disparaître, retirez-les de cette liste"
            echo "  de témoins dans le même commit que leur suppression."
            exit 1
          fi
          echo "   $VUS témoin(s) servi(s) en ligne, tous présents dans ce build — rien ne sera effacé."
          [ "$MUETS" = "0" ] || echo "   ($MUETS témoin(s) sans réponse, non comptés.)"

      - name: 🚀 Déployer via FTP vers veritas-school.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server:   ftp.veritas-school.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir:  ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.gitkeep
          log-level: standard

      - name: 🔎 Vérifier le RAG (biblio_index.db présent sur le serveur)
        if: always()
        run: |
          echo "Vérification de l'index RAG sur https://veritas-school.com ..."
          RESP=$(curl -s --max-time 25 "https://veritas-school.com/api/rag.php?q=cameroun+minesec+francais&limit=1" || echo "")
          echo "Réponse rag.php : ${RESP:0:300}"
          if echo "$RESP" | grep -qE '"ok"[[:space:]]*:[[:space:]]*true'; then
            echo "✅ RAG actif : biblio_index.db répond sur le serveur."
          else
            echo "::warning title=RAG inactif (corpus absent)::biblio_index.db n'est PAS sur le serveur — l'IA répond SANS le corpus MINESEC. Il est gitignoré (22 Mo) donc jamais déployé par la CI : uploadez-le manuellement en FTP vers …/api/data/biblio_index.db. Régénérez-le au besoin avec 'python index_corpus.py'."
          fi

      - name: 🔁 Rappel — version du Service Worker
        if: always()
        run: |
          SW_VER=$(grep -oE "veritas-v[0-9]+\.[0-9]+(\.[0-9]+)?" sw.js | head -1)
          echo "Service Worker déployé : ${SW_VER:-inconnu}"
          echo "::notice title=Service Worker (cache)::Incrémentez CACHE_VERSION dans sw.js à CHAQUE déploiement de contenu, sinon les appareils gardent l'ancienne version en cache. Version actuelle : ${SW_VER:-inconnu}."

      - name: ✅ Résumé du déploiement
        if: success()
        run: |
          echo "🎉 Déploiement réussi sur https://veritas-school.com"
          echo "   app.html / index.html → VÉRITAS v1.2"
          echo "   index.php             → wrapper no-cache LiteSpeed"
          echo "   api/db.php            → persistance JSON LWS"
          echo "   api/upload.php        → upload fichiers LWS"
          echo "   api/sync.php          → sync legacy (compatibilité)"
          echo "   Déployé le : $(date '+%d/%m/%Y à %H:%M:%S UTC')"
