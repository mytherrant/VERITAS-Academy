# ============================================================
# VÉRITAS — Filet de tests E2E (smoke) — Playwright
# Tourne sur chaque push de branche qui touche le frontend, et sur les PR
# vers master. Objectif : attraper un « écran blanc » AVANT le déploiement.
# ============================================================
name: 🧪 Tests E2E (smoke)

on:
  push:
    branches: ['**']
    paths:
      - 'VERITAS_v1.2.html'
      - 'app.js'
      - 'app.css'
      - 'api/**'
      - 'tests/**'
      - 'playwright.config.cjs'
      - 'package.json'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Chaque surface payante débloque-t-elle vraiment quelque chose ?
  #
  # Dix bugs d'argent trouvés à la main en une session, tous identiques : le
  # paiement réussit, l'argent rentre, et rien ne s'ouvre. Aucune exception,
  # aucune trace — le symptôme est l'absence de symptôme. Ce job parcourt les
  # surfaces une à une, confirme un paiement et va LIRE le droit en base.
  # Il tourne avant le smoke test : il est dix fois plus rapide, et un chemin
  # d'argent cassé est plus grave qu'un écran blanc.
  # ──────────────────────────────────────────────────────────────────────────
  paiements:
    name: 💰 Surfaces payantes (octroi, prix, idempotence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl
          coverage: none
      - name: 🔎 Syntaxe des endpoints de paiement
        run: |
          for f in api/_auth_lib.php api/payment_camerpay.php api/payment_campay.php \
                   api/payment_mtn.php api/payment_orange.php api/_pay_funds_lib.php; do
            [ -f "$f" ] && php -l "$f"
          done
      # ────────────────────────────────────────────────────────────────────
      # ⚠️ CES BANCS EXISTAIENT ET NE TOURNAIENT PAS.
      # Audit du 02/09/2026 : le dossier tests/ portait une cinquantaine de
      # bancs — dont ceux qui gardent l'émission des codes, la remise par SMS,
      # l'ouverture des cahiers et le prix de chaque ouvrage — et le workflow
      # n'en appelait que DEUX. Tous verts quand on les lance à la main : ils
      # fonctionnent, ils n'étaient simplement jamais exécutés. Une régression
      # sur la remise des codes serait passée au déploiement sans un mot.
      #
      # Tous vérifiés SANS le dossier uploads/protected/livrets/ (déposé par
      # FTP, absent du dépôt et donc absent de la CI) : aucun n'en dépend.
      # ────────────────────────────────────────────────────────────────────
      - name: 💰 Un paiement confirmé écrit-il un droit ?
        run: php tests/paiements_entitlements.php

      - name: 🪪 L'acheteur est-il reconnu par son compte ?
        run: php tests/banc_identite_acheteur.php

      - name: 📕 Un livre amputé se vend-il quand même ?
        run: php tests/banc_livre_integre.php

      - name: 🔔 L'abonné est-il prévenu avant l'échéance ?
        run: php tests/banc_relance_echeance.php

      - name: 🏷️ Chaque ouvrage a-t-il un prix et une porte ?
        run: php tests/ouvrages_en_vente.php

  smoke:
    name: 🌐 Boot du portail (Chromium headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 📦 Installer les dépendances
        run: npm ci || npm install
      # ──────────────────────────────────────────────────────────────────
      # Sans navigateur, donc en quelques secondes, et AVANT Chromium :
      # une entrée de menu sans route ne lève aucune exception — `render()`
      # se termine par `P[p]||pgDash` et sert le tableau de bord sous le
      # titre de la page demandée. Playwright ne verrait qu'un écran rendu.
      # ──────────────────────────────────────────────────────────────────
      - name: 🚪 Espaces par rôle (entrées mortes, chiffres inventés)
        run: node tests/espaces_roles.cjs

      # Les bancs sans navigateur, dans l'ordre du parcours d'achat : le code
      # est-il émis, remis, et le cahier s'ouvre-t-il sur ce code ? Quelques
      # secondes au total, avant les trois minutes de Chromium.
      - name: 🎟️ Émission et livraison des codes
        run: |
          node tests/banc_livret_codes.cjs
          node tests/banc_remise_code.cjs
          node tests/banc_remise_sms.cjs

      - name: 📓 Ouverture des cahiers et de leurs corrigés
        run: |
          node tests/banc_cahier.cjs
          node tests/banc_cahiers_reels.cjs
          node tests/banc_empreintes.cjs
          node tests/banc_cles_cahier.cjs

      - name: 🛍️ La boutique ne vend que ce qui s'ouvre
        run: node tests/banc_boutique_unifiee.cjs

      - name: 👤 Le compte remonte-t-il du serveur ?
        run: node tests/banc_compte_serveur.cjs
      - name: 🌐 Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: 🧪 Lancer les tests
        run: npx playwright test
      - name: 📤 Rapport (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
