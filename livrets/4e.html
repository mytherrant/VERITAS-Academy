<!--
  ══════════════════════════════════════════════════════════════════════════
  CETTE COQUILLE NE SAVAIT PLUS LIRE LE CAHIER QU'ON LUI LIVRAIT.
  © 2024-2026 Jacques Miterand TAKOU (Mythe Errant).

  Le 01/09/2026, un client a payé son cahier de 6ᵉ, l'a ouvert, et le livre
  s'arrêtait après le sommaire. Le fichier était sur le serveur, complet et
  intact — vérifié : 309,7 Ko sur le disque, exactement ce que produit
  `tools/normaliser_cahiers.py`. Il a bien été livré : la page a peint le
  filigrane nominatif de l'acheteur, ce qu'elle ne fait qu'après une livraison
  réussie.

  MAIS LA PAGE ET LE FICHIER NE PARLAIENT PLUS LA MÊME LANGUE. Le 28/08/2026,
  tous les cahiers ont été ramenés à un format unique — `window.CAHIER_BLOCS`,
  une liste de blocs plate que rend `livrets/cahier.js`. C'était le but même de
  la normalisation : trois formats à l'édition, un seul à l'exécution.
  Cette coquille-ci, elle, cherchait toujours `window.BOOKLET_4E` — le format
  d'avant. Elle recevait 1 181 blocs et n'en voyait aucun.

  Rien ne plantait, rien n'apparaissait dans la console : le sommaire
  s'affichait sans un chiffre, et le livre s'arrêtait là, sous le nom de celui
  qui venait de le payer. Huit coquilles étaient dans ce cas — les quatre
  cahiers d'élève de 6ᵉ à 3ᵉ et leurs quatre guides d'enseignant, c'est-à-dire
  les ouvrages les plus vendus.

  POURQUOI UNE REDIRECTION PLUTÔT QU'UNE RÉPARATION. Le gabarit de cette page
  compose un modèle `{sequences → weeks → items}` qui n'existe plus nulle
  part ; le reconstruire à partir des blocs plats reviendrait à réécrire
  `cahier.js` une seconde fois, et à retomber dans les deux vérités que la
  normalisation venait supprimer. Un seul moteur rend les cahiers.

  ET POURQUOI ON GARDE L'ADRESSE. Elle est imprimée dans les manuels, elle est
  dans des QR codes, elle est en favori chez des élèves, et `vrt_livret_etat()`
  y envoie l'acheteur dès qu'un fichier `<slug>.html` existe. La supprimer
  ferait un 404 à la place d'un cahier. On redirige, on n'efface pas.

  Le contenu de la page d'origine reste dans l'historique git.
  ══════════════════════════════════════════════════════════════════════════
-->
