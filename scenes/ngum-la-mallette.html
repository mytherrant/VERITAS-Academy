    { t: 'dit', qui: 'vonroehm', txt: 'Tout est prévu pour que vous n’ayez aucun désagrément : nous aménagerons des embarcadères, dans vos nouveaux quartiers, nous y construirons des routes, des écoles et des églises.', cite: 'David Mbanga Eyombwan, Ngum a Jemea, acte II, scène I' },
