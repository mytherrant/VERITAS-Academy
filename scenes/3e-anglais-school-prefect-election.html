    tom:     { nom: 'Tom, candidate', couleur: '#2F5E9E', look: { metier: 'eleve', peau: 'fonce', cheveux: 'court' } },
    student: { nom: 'Fanny, a voter', couleur: '#1F6F78', look: { metier: 'eleve', tenue: 'jupe', peau: 'brun', cheveux: 'queue' } },

  },
  etapes: [
    { t: 'recit', entre: ['teacher', 'mary', 'tom'], txt: 'It is election week. Two students are standing for the post of senior prefect. Mr Njoh organises the debate.', trad: 'C’est la semaine des élections. Deux élèves se présentent au poste de préfet principal. M. Njoh organise le débat.', objet: { i: 'porteVoix', lib: 'The debate' } },

    { t: 'dit', qui: 'mary', txt: 'If you elect me, I will set up a reading club, I will look after the school garden, and I will carry out a survey to listen to every class.', trad: 'Si vous m’élisez, je créerai un club de lecture, je m’occuperai du jardin scolaire et je mènerai une enquête pour écouter chaque classe.', jauges: { votes: 45, english: 40 } },
    { t: 'remarque', titre: 'Phrasal verbs', txt: 'Un verbe + une particule = un nouveau sens : stand for (se présenter à une élection), set up (créer, mettre en place), look after (s’occuper de), carry out (mener, réaliser), give up (abandonner).' },

    { t: 'question', q: 'Quelle promesse est réaliste, et laquelle ne l’est pas ?',

        { txt: 'Mary’s promises are realistic ; Tom’s are impossible for a prefect.', ok: true, retour: 'A prefect cannot cancel homework or pay for snacks. A good candidate makes promises he or she can keep.' },

    { t: 'remarque', titre: 'Word order in questions', txt: 'Wh- word + auxiliary + subject + verb : How will you choose…? Where do you live? What did she say? Ne dites pas « How you will choose? » : l’auxiliaire passe devant le sujet.' },
    { t: 'atelier', mode: 'ordre', titre: 'Workshop · build the question', consigne: 'Remets les mots dans l’ordre : « Quand créeras-tu le club ? »',

    { t: 'dit', qui: 'mary', txt: 'Every class will suggest books. We will vote, won’t we?', trad: 'Chaque classe proposera des livres. Nous voterons, n’est-ce pas ?' },

      cats: ['set up', 'look after', 'carry out', 'stand for'],
      items: [
        { txt: 'créer, mettre en place', cat: 0 },
        { txt: 's’occuper de', cat: 1 },
        { txt: 'mener, réaliser', cat: 2 },
        { txt: 'se présenter à une élection', cat: 3 }

      bravo: 'Phrasal verbs are very common in English: learn them in context.' },

        { txt: 'For Tom: free snacks!', consequence: 'Tom wins… and cannot keep a single promise. The students are disappointed.', jauges: { votes: -15 } },
        { txt: 'For Mary: her promises are realistic.', consequence: 'You vote for a programme, not for a dream. That is a responsible vote.', jauges: { votes: 30, english: 10 } }

      oeuvre: 'A responsible voter compares programmes and asks: can the candidate really do it?' },
    { t: 'dit', qui: 'teacher', emo: 'joie', jeu: 'after the count', txt: 'Mary is our new senior prefect! Congratulations. Tom, you will help her, won’t you?', trad: 'Mary est notre nouvelle préfète principale ! Félicitations. Tom, tu l’aideras, n’est-ce pas ?', jauges: { votes: 80, english: 85 } }

  labo: {
    titre: 'Laboratory · the school election',
    intro: 'Règle le réalisme des promesses, l’information des électeurs et la participation : qui est élu, et pour quel mandat ?',
    persos: ['mary', 'tom', 'student', 'teacher'],
    curseurs: [
      { id: 'realism', nom: 'Realistic promises', val: 70, bas: 'dreams', haut: 'realistic' },
      { id: 'information', nom: 'Voters’ information', val: 55, bas: 'none', haut: 'debate and questions' },
      { id: 'turnout', nom: 'Turnout', val: 60, bas: 'low', haut: 'high' }

    scenarios: [
      { nom: 'Election week', icone: 'porteVoix', valeurs: { realism: 70, information: 55, turnout: 60 } },

      { nom: 'Nobody votes', icone: 'muet', valeurs: { turnout: 10 } }

      { a: 'mary', b: 'tom', type: 'conflit', lib: 'rivals', base: .5 },
      { a: 'teacher', b: 'student', type: 'confiance', lib: 'organises', base: .4 }
    ],
    issue: function(v){
      if(v.turnout < 30){ return { niveau: 'moyen', badge: 'Elected by a few', recit: 'Only a few students vote: the new prefect does not really represent the school.', apres: 'Voting is a right and a duty.', themes: ['turnout'] }; }
      if(v.realism < 35 && v.information < 40){ return { niveau: 'ko', badge: 'Broken promises', recit: 'The candidate with the biggest promises wins, then does nothing he promised.', apres: 'Ask questions before you vote.', themes: ['responsible vote'] }; }
      return { niveau: 'ok', badge: 'A good prefect', recit: 'Informed voters choose a realistic programme: the reading club starts next month.', apres: 'Democracy starts at school.', themes: ['school election', 'phrasal verbs'] };
    }
  },
  quiz: [
    { q: 'Que signifie « to stand for » (élection) ?', options: [
      { txt: 'Se présenter à une élection.', ok: true, retour: 'She is standing for senior prefect.' },
      { txt: 'Se lever.', retour: 'Se lever = to stand up.' } ] },
    { q: 'Quel est l’ordre correct ?', options: [
      { txt: 'How will you help us?', ok: true, retour: 'Wh- + auxiliary + subject + verb.' },
      { txt: 'How you will help us?', retour: 'L’auxiliaire passe devant le sujet.' } ] },
    { q: '« We will vote, … ? »', options: [
      { txt: 'won’t we', ok: true, retour: 'Phrase affirmative → tag négatif.' },
      { txt: 'will we', retour: 'Seulement après une phrase négative.' } ] },
    { q: 'Que signifie « to set up a club » ?', options: [
      { txt: 'Créer un club.', ok: true, retour: 'set up = mettre en place.' },
      { txt: 'Fermer un club.', retour: 'Non.' } ] },
    { q: 'Qu’est-ce qu’un vote responsable ?', options: [
      { txt: 'Choisir un programme réaliste après s’être informé.', ok: true, retour: 'Comparer, questionner, décider.' },
      { txt: 'Voter pour celui qui promet le plus.', retour: 'Les promesses doivent pouvoir être tenues.' } ] }
  ],
  bilan: {
    retenir: [
      'Election vocabulary: to stand for, a candidate, a campaign, a promise, to vote, a voter, the count.',
      'Phrasal verbs: set up, look after, carry out, give up.',
      'Questions: Wh- + auxiliary + subject + verb (How will you…?).',
      'Question tags: We will vote, won’t we?'
    ],
    ecrire: 'Write your own campaign speech (eight lines) for the post of class prefect. Use three phrasal verbs and end with a question tag.'
  }
};
</script>
